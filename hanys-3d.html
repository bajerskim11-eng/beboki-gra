<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanys — 3D AI</title><style>html,body{margin:0;height:100%;background:#0b0d10;color:#fff;font-family:system-ui}body{display:grid;grid-template-columns:1fr 340px}.stage{position:relative;min-width:0}canvas{width:100%;height:100%;display:block}.panel{padding:22px;background:#151817;border-left:1px solid #30352f}.panel h1{margin:0 0 8px}.status{font-size:13px;opacity:.7;margin:10px 0 20px}.tip{padding:12px;border-radius:12px;background:#20261f;line-height:1.45;font-size:13px}.btn{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:#9ac46a;font-weight:800;cursor:pointer}.small{font-size:11px;opacity:.5;margin-top:16px;line-height:1.5}@media(max-width:800px){body{grid-template-columns:1fr}.stage{height:70vh}.panel{height:30vh;overflow:auto}}</style></head><body><div class="stage"><canvas id="c"></canvas></div><aside class="panel"><h1>Hanys w 3D</h1><div id="s" class="status">Startuję generator…</div><div class="tip">Biorę prawdziwe zdjęcie Hanysa z Shopify i wysyłam je do darmowego image→3D. Gdy GLB wróci, pojawi się tutaj i możesz go obracać.</div><button class="btn" id="again">Wygeneruj ponownie</button><div class="small">Źródło obrazu: Shopify • generator: three.ws free image→3D • viewer: Three.js</div></aside><script type="module">import * as THREE from 'https://esm.sh/three@0.179.1';import{OrbitControls}from'https://esm.sh/three@0.179.1/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.179.1/examples/jsm/loaders/GLTFLoader.js';const IMG='https://cdn.shopify.com/s/files/1/1019/1903/1622/files/hanys.jpg?v=1787742427',API='https://three.ws/api/forge';const c=document.querySelector('#c'),s=document.querySelector('#s');const r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));const sc=new THREE.Scene();sc.background=new THREE.Color(0x0b0d10);const cam=new THREE.PerspectiveCamera(35,1,.1,100);cam.position.set(0,1.2,4);const ctl=new OrbitControls(cam,c);ctl.target.set(0,1,0);ctl.enableDamping=true;ctl.enablePan=false;sc.add(new THREE.HemisphereLight(0xffffff,0x333333,2.2));const l=new THREE.DirectionalLight(0xffffff,3);l.position.set(3,5,4);sc.add(l);let obj=new THREE.Group();sc.add(obj);function load(url){new GLTFLoader().load(url,g=>{obj.clear();obj.add(g.scene);g.scene.position.y=-1;g.scene.scale.setScalar(1.6);s.textContent='Gotowe — Hanys 3D działa. Obracaj myszką.'},undefined,e=>{console.error(e);s.textContent='GLB powstał, ale viewer nie mógł go wczytać.'})}async function gen(){s.textContent='GPU: generuję Hanysa 3D…';try{const q=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image_urls:[IMG],tier:'draft'})});const a=await q.json();if(!q.ok)throw Error(a.error||a.message||('HTTP '+q.status));if(a.glb_url){load(a.glb_url);return}if(!a.job_id)throw Error('Brak zadania');for(let i=0;i<90;i++){await new Promise(x=>setTimeout(x,4000));const p=await fetch(API+'?job='+encodeURIComponent(a.job_id)).then(x=>x.json());if(p.status==='done'&&p.glb_url){load(p.glb_url);return}if(p.status==='failed')throw Error(p.error||'Generowanie nieudane');s.textContent='GPU: pracuje… '+Math.round(i*4)+' s'}throw Error('Timeout')}catch(e){console.error(e);s.textContent='Generator chwilowo nie odpowiedział: '+e.message}}document.querySelector('#again').onclick=gen;gen();function resize(){const x=c.parentElement.getBoundingClientRect();r.setSize(x.width,x.height,false);cam.aspect=x.width/x.height;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);ctl.update();obj.rotation.y+=.0015;r.render(sc,cam)}loop();</script></body></html>
