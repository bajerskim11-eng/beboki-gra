<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanys 3D</title><style>html,body{margin:0;height:100%;background:#080a0d;color:#fff;font-family:system-ui}body{display:grid;grid-template-columns:1fr 320px}.stage{min-width:0}canvas{width:100%;height:100%;display:block}.panel{padding:24px;background:#12161b;border-left:1px solid #2a3038}.panel h1{font-size:30px;margin:0 0 8px}.status{opacity:.75;margin:8px 0 24px}.tip{padding:14px;background:#1b222a;border-radius:14px;line-height:1.5}.ok{display:inline-block;margin-top:18px;padding:8px 12px;border-radius:999px;background:#233b28;color:#9ee6a8}@media(max-width:800px){body{display:block}.stage{height:72vh}.panel{height:28vh;box-sizing:border-box;overflow:auto}}</style></head><body><div class="stage"><canvas id="c"></canvas></div><aside class="panel"><h1>Hanys — 3D</h1><div id="s" class="status">Ładuję model…</div><div class="tip">Pierwszy zapisany asset 3D Hanysa. Jest lekki i stylizowany, więc możemy już testować kamerę, ruch i animacje, a później podmienić geometrię na wynik SF3D.</div><div class="ok">● MODEL Z GITHUBA</div></aside><script type="module">import*as THREE from'https://esm.sh/three@0.179.1';import{OrbitControls}from'https://esm.sh/three@0.179.1/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.179.1/examples/jsm/loaders/GLTFLoader.js';const c=document.querySelector('#c'),s=document.querySelector('#s');const r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));const sc=new THREE.Scene();sc.background=new THREE.Color(0x080a0d);const cam=new THREE.PerspectiveCamera(35,1,.1,100);cam.position.set(0,1.8,6);const ctl=new OrbitControls(cam,c);ctl.target.set(0,1.7,0);ctl.enableDamping=true;ctl.minDistance=3;ctl.maxDistance=10;sc.add(new THREE.HemisphereLight(0xffffff,0x222833,2.4));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,6,5);sc.add(key);const fill=new THREE.DirectionalLight(0xffc878,1.5);fill.position.set(-4,2,2);sc.add(fill);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x171b20,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.46;sc.add(floor);const MODEL='https://raw.githubusercontent.com/bajerskim11-eng/beboki-gra/main/public/models/hanys.gltf';new GLTFLoader().load(MODEL,g=>{const o=g.scene;o.position.y=-.4;o.scale.setScalar(1.15);sc.add(o);s.textContent='Gotowe — Hanys 3D z GitHuba. Obracaj myszką / palcem.';function loop(){requestAnimationFrame(loop);ctl.update();o.rotation.y+=.002;r.render(sc,cam)}loop()},e=>{console.error(e);s.textContent='Nie udało się wczytać modelu: '+e.message});function resize(){const b=c.parentElement.getBoundingClientRect();r.setSize(b.width,b.height,false);cam.aspect=b.width/b.height;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();</script></body></html>
