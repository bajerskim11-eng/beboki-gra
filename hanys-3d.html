<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanys 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#080a0d;color:#fff;font-family:system-ui}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#ui{position:fixed;left:20px;top:20px;padding:18px 20px;border:1px solid #303641;border-radius:16px;background:#11151bdd;backdrop-filter:blur(8px);max-width:340px}h1{margin:0 0 6px;font-size:28px}.status{opacity:.75;font-size:14px}.ok{margin-top:10px;color:#9ee6a8;font-size:13px}</style></head><body><div id="stage"></div><div id="ui"><h1>Hanys — 3D</h1><div id="status" class="status">Ładowanie modelu…</div><div class="ok">● GLTF z GitHuba</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.179.1/examples/js/controls/OrbitControls.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.179.1/examples/js/loaders/GLTFLoader.js"></script><script>(function(){var stage=document.getElementById('stage'),status=document.getElementById('status');var scene=new THREE.Scene();scene.background=new THREE.Color(0x080a0d);var camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,1.7,6);var renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);stage.appendChild(renderer.domElement);var controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.set(0,1.5,0);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=12;scene.add(new THREE.HemisphereLight(0xffffff,0x252a33,2.2));var key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,6,5);scene.add(key);var rim=new THREE.DirectionalLight(0xffb45b,1.2);rim.position.set(-4,3,-3);scene.add(rim);var url='https://raw.githubusercontent.com/bajerskim11-eng/beboki-gra/main/public/models/hanys.gltf';new THREE.GLTFLoader().load(url,function(g){var o=g.scene;var box=new THREE.Box3().setFromObject(o),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());o.position.sub(center);var max=Math.max(size.x,size.y,size.z);o.scale.setScalar(3.1/max);scene.add(o);status.textContent='Gotowe — obracaj Hanysa myszką.';function loop(){requestAnimationFrame(loop);o.rotation.y+=.003;controls.update();renderer.render(scene,camera)}loop()},function(x){if(x.total)status.textContent='Ładowanie '+Math.round(x.loaded/x.total*100)+'%'},function(e){console.error(e);status.textContent='Nie udało się załadować GLTF. Otwórz konsolę przeglądarki.'});addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();</script></body></html>
