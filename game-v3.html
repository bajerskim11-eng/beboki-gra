<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Pierwsza Wyprawa</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#12100d;color:#f5e7c7;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button{font:inherit}.app{height:100dvh;display:flex;flex-direction:column}.hud{height:54px;display:flex;gap:6px;align-items:center;padding:7px;background:#17130f;border-bottom:1px solid #5c472d;z-index:50}.pill{background:#251e16;border:1px solid #806233;border-radius:10px;padding:5px 8px;font-size:10px;box-shadow:0 2px 8px #0005}.pill b{font-size:13px}.spacer{flex:1}.screen{position:relative;flex:1;overflow:hidden}.dock{height:64px;display:flex;gap:5px;padding:7px;background:#15110d;border-top:1px solid #5c472d;z-index:50}.dock button{flex:1;border:1px solid #6e552f;border-radius:10px;background:linear-gradient(#30271d,#1f1913);color:#ead7b2;font-weight:900;font-size:10px}.dock .on{background:linear-gradient(#738b47,#4f682d)}.title{position:absolute;z-index:20;top:11px;left:14px;font-size:21px;font-weight:950;text-shadow:0 2px 5px #000}.hint{position:absolute;z-index:20;top:39px;left:14px;font-size:11px;color:#eadfc8}.settlement{background:linear-gradient(#7ea0ad 0%,#b6c89a 45%,#6c754f 46%,#414633 100%)}.settlement:before{content:'';position:absolute;left:0;right:0;top:19%;height:28%;background:linear-gradient(90deg,#34434b 0 9%,transparent 9% 14%,#46545b 14% 22%,transparent 22% 27%,#39464e 27% 37%,transparent 37% 44%,#4c565a 44% 52%,transparent 52% 58%,#39474d 58% 68%,transparent 68% 74%,#4a5558 74% 83%,transparent 83%);opacity:.72}.ground{position:absolute;left:-10%;right:-10%;bottom:-9%;height:67%;background:radial-gradient(ellipse at center,#8b865e 0 2%,transparent 2.5%),linear-gradient(145deg,transparent 44%,#b6a87a 45% 47%,transparent 48%),linear-gradient(35deg,transparent 44%,#a5986d 45% 47%,transparent 48%);background-size:90px 90px,100% 100%,100% 100%;transform:perspective(400px) rotateX(18deg);transform-origin:center bottom}.path{position:absolute;left:38%;top:37%;width:25%;height:62%;background:linear-gradient(90deg,#b9a875,#d1bf8b,#a99668);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);opacity:.9}.hut{position:absolute;z-index:5;width:31%;height:22%;background:linear-gradient(#a87b4c 0 15%,#62452f 16% 100%);border:2px solid #4c3626;border-radius:8px;box-shadow:0 9px 14px #0005}.hut:before{content:'';position:absolute;left:-7%;top:-38%;width:114%;height:55%;background:#493425;clip-path:polygon(50% 0,100% 100%,0 100%);border:2px solid #2d2118}.hut:after{content:'';position:absolute;left:39%;bottom:0;width:22%;height:43%;background:#2b2019;border:2px solid #8b693f}.hanysMine{left:4%;top:37%}.home{left:34%;top:28%;width:36%;height:27%;background:linear-gradient(#b98958 0 15%,#76523a 16% 100%)}.home:before{left:-8%;width:116%;top:-42%;height:64%}.tower{right:3%;top:34%;height:31%;width:23%;background:linear-gradient(#6f5140,#49362c)}.tower:before{top:-25%;height:38%;}.work{left:3%;top:68%;width:30%;height:18%}.shelter{right:5%;top:69%;width:30%;height:18%}.sign{position:absolute;z-index:15;background:#30261b;color:#f3dfb7;border:1px solid #a57d42;border-radius:7px;padding:5px 8px;font-size:9px;font-weight:950;box-shadow:0 3px 7px #0006;text-align:center}.s1{left:35%;top:39%}.s2{left:3%;top:31%}.s3{right:2%;top:30%}.s4{left:2%;top:63%}.s5{right:3%;top:64%}.hero{position:absolute;z-index:18;width:72px;text-align:center;font-size:9px;font-weight:950;text-shadow:0 1px 3px #000;cursor:pointer;transition:transform .15s}.hero:active{transform:scale(.94)}.hero img{width:68px;height:95px;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 8px 5px #1c160f99)}.selected{filter:drop-shadow(0 0 8px #f4cf6a)!important}.p1{left:28%;top:36%}.p2{left:62%;top:43%}.p3{left:17%;top:61%}.p4{left:64%;top:62%}.label{position:absolute;z-index:25;background:#1c1711dd;border:1px solid #9a743d;border-radius:9px;padding:7px 9px;bottom:8%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;white-space:nowrap}.panel{position:absolute;z-index:40;left:6%;right:6%;top:13%;bottom:12%;padding:17px;background:#19140ff5;border:1px solid #9a743d;border-radius:18px;display:none;overflow:auto;box-shadow:0 18px 50px #0009}.panel.show{display:block}.close{float:right;background:none;border:0;color:white;font-size:25px}.action{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #7f6338;background:linear-gradient(#718b45,#4f692f);color:white;font-weight:900}.map{background:linear-gradient(#9c9b7a,#60654e)}.map:after{content:'';position:absolute;inset:18% 4% 8%;background:repeating-linear-gradient(25deg,transparent 0 35px,#4f5a48 36px 39px),repeating-linear-gradient(110deg,transparent 0 48px,#778068 49px 52px);opacity:.6}.mapcard{position:absolute;z-index:15;left:9%;right:9%;padding:14px;background:#211a13eF;border:1px solid #a27b43;border-radius:13px;box-shadow:0 7px 15px #0005}.m1{top:25%}.m2{top:45%;opacity:.65}.m3{top:65%;opacity:.5}.mission{background:#18130f}.room{position:absolute;left:4%;right:4%;top:14%;bottom:10%;overflow:hidden;border:7px solid #47382c;border-radius:10px;background:linear-gradient(#493a2e,#3b3027);box-shadow:inset 0 0 80px #000c}.room:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,#6a5543 32px 35px),repeating-linear-gradient(90deg,transparent 0 57px,#2c241e 58px 61px);opacity:.45}.beam{position:absolute;background:#241d17;box-shadow:0 3px 5px #0008;z-index:3}.beam.a{left:0;right:0;top:16%;height:18px;transform:rotate(-2deg)}.beam.b{top:0;bottom:0;left:25%;width:15px;transform:rotate(3deg)}.pipe{position:absolute;z-index:4;border:7px solid #65706b;border-left:0;border-radius:0 30px 30px 0;opacity:.8}.pipe.a{right:0;top:15%;width:28%;height:27%}.pipe.b{left:0;top:50%;width:22%;height:18%}.crate{position:absolute;z-index:5;width:50px;height:45px;background:repeating-linear-gradient(0deg,#684a2e 0 7px,#7b5935 8px 11px);border:3px solid #39271b;box-shadow:0 6px 6px #0007}.c1{left:8%;bottom:18%}.c2{right:8%;top:31%}.rubble{position:absolute;z-index:6;font-size:42px}.r1{left:31%;top:30%}.r2{left:57%;top:55%}.lantern{position:absolute;z-index:5;font-size:34px}.l1{left:12%;top:12%}.l2{right:18%;top:17%}.dog{position:absolute;z-index:9;right:9%;bottom:10%;font-size:58px;filter:drop-shadow(0 5px 3px #0007);animation:pulse 1.7s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.unit{position:absolute;z-index:12;width:67px;text-align:center;font-size:9px;font-weight:950;transition:left .55s ease,top .55s ease;cursor:pointer}.unit img{width:64px;height:91px;object-fit:contain;filter:drop-shadow(0 7px 4px #0009)}.u1{left:8%;top:55%}.u2{left:25%;top:63%}.u3{left:43%;top:50%}.u4{left:57%;top:64%}.objective{position:absolute;z-index:30;left:9px;right:9px;top:53px;background:#17130ed9;border:1px solid #806233;border-radius:9px;padding:7px;font-size:10px}.missionbar{position:absolute;z-index:35;left:7px;right:7px;bottom:7px;display:flex;gap:4px}.missionbar button{flex:1;padding:10px 2px;background:#211a13;border:1px solid #806233;color:#f4dfb3;border-radius:9px;font-weight:900;font-size:9px}.toast{position:absolute;z-index:60;left:8%;right:8%;top:43%;padding:14px;background:#19140ff5;border:1px solid #b08a4c;border-radius:14px;text-align:center;font-weight:900;display:none;box-shadow:0 15px 40px #000b}.toast.show{display:block}.progress{position:absolute;z-index:30;left:10px;right:10px;bottom:60px;height:7px;background:#201a14;border:1px solid #6d532e;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#91a951;transition:width .3s}</style></head><body><div class=app><div class=hud><div class=pill>🪙 <b id=coins>500</b></div><div class=pill>⛏️ <b id=ore>120</b></div><div class=pill>🐕 <b id=dogs>0</b></div><div class=spacer></div><div class=pill>LVL <b id=lvl>1</b></div></div><main id=screen class="screen settlement"></main><nav class=dock><button id=bHome class=on onclick=settlement()>🏠 OSADA</button><button onclick=showMap()>🗺️ MAPA</button><button onclick=showTeam()>👥 DRUŻYNA</button><button onclick=mission()>🐕 MISJA</button></nav></div><script>const A='https://cdn.shopify.com/s/files/1/1019/1903/1622/files/';const imgs={hanys:A+'bebok-hanys-sprite.png?v=1787898068',hopla:A+'bebok-hopla-sprite.png?v=1787898081',fachura:A+'bebok-fachura-sprite.png?v=1787898095',podciep:A+'bebok-podciep-sprite.png?v=1787898110'};let s=JSON.parse(localStorage.bebokV3||'{"coins":500,"ore":120,"dogs":0,"lvl":1}'),selected='hanys',actions=0;const $=id=>document.getElementById(id);function save(){localStorage.bebokV3=JSON.stringify(s);$('coins').textContent=s.coins;$('ore').textContent=s.ore;$('dogs').textContent=s.dogs;$('lvl').textContent=s.lvl}function nav(){document.querySelectorAll('.dock button').forEach(x=>x.classList.remove('on'))}function hero(cls,k,n,click='selectHero') {return `<div class="hero ${cls}" onclick="${click}('${k}')"><img src="${imgs[k]}">${n}</div>`}function settlement(){nav();$('bHome').classList.add('on');$('screen').className='screen settlement';$('screen').innerHTML=`<div class=ground></div><div class=path></div><div class="title">OSADA BEBOKÓW</div><div class=hint>Twoja baza. Kliknij budynek albo Beboka.</div><div class="hut hanysMine"></div><div class="hut home"></div><div class="hut tower"></div><div class="hut work"></div><div class="hut shelter"></div><div class="sign s1">SIEDZIBA<br>BEBOKÓW</div><div class="sign s2">KOPALNIA<br>HANYSA</div><div class="sign s3">LATARNIA<br>PODCIEPA</div><div class="sign s4">WARSZTAT<br>FACHURY</div><div class="sign s5">SCHRONISKO<br>DLA PSÓW</div>${hero('p1','hanys','Hanys')} ${hero('p2','podciep','Podciep')} ${hero('p3','fachura','Fachura')} ${hero('p4','hopla','Hopla')}<div class=label>🏚️ OSADA ROŚNIE · 🐕 URATOWANE PSY: ${s.dogs}</div><div id=panel class=panel></div>`;save()}function selectHero(k){selected=k;showTeam()}function showPanel(title,body){$('panel').innerHTML=`<button class=close onclick="$('panel').classList.remove('show')">×</button><h2>${title}</h2><p>${body}</p><button class=action onclick="upgrade()">🔨 ULEPSZ OSADĘ — 100 🪙</button><button class=action onclick="mission()">🐕 WYRUSZ NA WYPRAWĘ</button>`;$('panel').classList.add('show')}function upgrade(){if(s.coins<100)return toast('Brakuje monet');s.coins-=100;s.ore+=25;s.lvl++;save();toast('Osada ulepszona · +25 rudy')}function showMap(){nav();$('screen').className='screen map';$('screen').innerHTML=`<div class=title>MAPA KATOWIC</div><div class=hint>Wybierz lokację wyprawy.</div><div class="mapcard m1" onclick=mission()>🏚️ <b>PIWNICE KAMIENICY</b><br><small>🐕 Pies wyczuwa coś pod ziemią · GOTOWE</small></div><div class="mapcard m2">⛏️ <b>STARA KOPALNIA</b><br><small>🔒 Odblokuj po 3 uratowanych psach</small></div><div class="mapcard m3">🌆 <b>CENTRUM KATOWIC</b><br><small>🔒 Wkrótce</small></div>`}function showTeam(){nav();$('screen').className='screen settlement';$('screen').innerHTML=`<div class=ground></div><div class=title>DRUŻYNA</div><div class=hint>Dotknij Beboka, żeby go wybrać.</div>${hero('p1','hanys','Hanys','pick')} ${hero('p2','podciep','Podciep','pick')} ${hero('p3','fachura','Fachura','pick')} ${hero('p4','hopla','Hopla','pick')}<div class="panel" style="display:block;top:64%;bottom:7%"><h2>⚒️ ${selected.toUpperCase()}</h2><p>${selected==='hanys'?'Kopanie i usuwanie zawałów.':selected==='hopla'?'Zwiad i wykrywanie ukrytych przejść.':selected==='fachura'?'Mechanizmy i naprawy.':'Światło i odkrywanie ciemnych tuneli.'}</p><button class=action onclick=mission()>🐕 ZACZNIJ PIERWSZĄ MISJĘ</button></div>`}function pick(k){selected=k;showTeam()}function unit(cls,k,n){return `<div id=${cls} class="unit ${cls}" onclick="selected='${k}';toast('${n} wybrany')"><img src="${imgs[k]}">${n}</div>`}function mission(){nav();$('screen').className='screen mission';actions=0;$('screen').innerHTML=`<div class=title>PIWNICE KAMIENICY</div><div class=objective>🐕 CEL: odnajdź psa · wykonaj 3 działania · dotknij Beboka, aby go wybrać</div><div class=room><div class="beam a"></div><div class="beam b"></div><div class="pipe a"></div><div class="pipe b"></div><div class="crate c1"></div><div class="crate c2"></div><div class="rubble r1">🪨</div><div class="rubble r2">🧱</div><div class="lantern l1">🏮</div><div class="lantern l2">🏮</div>${unit('u1','hanys','Hanys')} ${unit('u2','hopla','Hopla')} ${unit('u3','fachura','Fachura')} ${unit('u4','podciep','Podciep')}<div class=dog>🐶</div></div><div class=progress><i id=prog></i></div><div class=missionbar><button onclick=act('hanys')>⛏️ KOP</button><button onclick=act('hopla')>🪢 SZUKAJ</button><button onclick=act('fachura')>🔧 NAPRAW</button><button onclick=act('podciep')>🏮 ŚWIATŁO</button></div><div id=toast class=toast></div>`}function act(k){const map={hanys:['u1','34%','30%','Hanys usuwa zawał!'],hopla:['u2','51%','42%','Hopla znajduje ukryte przejście!'],fachura:['u3','66%','55%','Fachura uruchamia mechanizm!'],podciep:['u4','78%','39%','Podciep rozświetla tunel!']};const [id,x,y,msg]=map[k];$(id).style.left=x;$(id).style.top=y;actions++;$('prog').style.width=Math.min(100,actions/3*100)+'%';toast(msg);if(actions>=3)setTimeout(win,650)}function win(){s.dogs++;s.coins+=120;s.ore+=15;save();toast('🐕 URATOWANY PIES! +120 🪙 · +15 ⛏️');setTimeout(settlement,1500)}function toast(t){const x=$('toast');if(!x){alert(t);return}x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1150)}settlement();</script></body></html>
