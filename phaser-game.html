<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Phaser Prototype</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0907;font-family:Arial,sans-serif}#game{width:100%;height:100%;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none;color:#f4ead8}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:auto}.pill{background:#17130eef;border:1px solid #73572f;border-radius:14px;padding:9px 12px;box-shadow:0 5px 15px #0008;font-size:12px}.pill b{font-size:15px}.spacer{flex:1}.bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;pointer-events:auto}.bottom button{flex:1;border:1px solid #806233;border-radius:13px;padding:13px 8px;background:#211a12;color:#f3dfb1;font-weight:800}.bottom button.active{background:#6a7e3c}.toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);background:#f0dfbc;color:#302619;border-radius:15px;padding:11px 15px;font-weight:800;max-width:88%;text-align:center;display:none;pointer-events:none}.panel{position:absolute;left:10px;right:10px;top:72px;background:#15110dec;border:1px solid #73572f;border-radius:17px;padding:14px;display:none;pointer-events:auto;max-height:60vh;overflow:auto}.panel h2{margin:0 0 8px;font-size:21px}.row{display:flex;align-items:center;gap:10px;border-top:1px solid #3d3020;padding:10px 0}.row img{width:54px;height:70px;object-fit:cover;object-position:top;border-radius:10px}.row button{margin-left:auto;border:1px solid #806233;border-radius:10px;background:#6a7e3c;color:#fff;padding:9px;font-weight:800}</style></head><body><div id="game"></div><div id="ui"><div class="top"><div class="pill">🪙 <b id="coins">500</b></div><div class="pill">⛏️ <b id="ore">120</b></div><div class="pill">🐕 <b id="dogs">0</b>/10</div><div class="spacer"></div><div class="pill">BEBOKI</div></div><div id="panel" class="panel"></div><div id="toast" class="toast"></div><div class="bottom"><button id="settle" class="active">🏠 OSADA</button><button id="mission">🗺️ MISJA</button><button id="team">👥 DRUŻYNA</button></div></div><script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.js"></script><script>
const IMG={hanys:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpeg?v=1787894020',hopla:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game.jpeg?v=1787894032',fachura:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game.jpeg?v=1787894045',podciep:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game.jpeg?v=1787894060'};
let state={coins:500,ore:120,dogs:0,scene:'settlement',actions:0};try{Object.assign(state,JSON.parse(localStorage.bebokPhaser||'{}'))}catch(e){}function save(){localStorage.bebokPhaser=JSON.stringify(state);coins.textContent=state.coins;ore.textContent=state.ore;dogs.textContent=state.dogs}save();
const toast=(t)=>{const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display='none',1800)};
const panel=document.getElementById('panel');function showPanel(html){panel.innerHTML=html;panel.style.display='block'}function hidePanel(){panel.style.display='none'}
function sceneButton(name){state.scene=name;hidePanel();game.scene.start(name==='settlement'?'Settlement':'Mission');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));document.getElementById(name==='settlement'?'settle':'mission').classList.add('active');save()}
document.getElementById('settle').onclick=()=>sceneButton('settlement');document.getElementById('mission').onclick=()=>sceneButton('mission');document.getElementById('team').onclick=()=>{showPanel('<h2>DRUŻYNA BEBOKÓW</h2>'+[['hanys','Hanys','Budowniczy'],['hopla','Hopla','Zwiadowczyni'],['fachura','Fachura','Wynalazca'],['podciep','Podciep','Latarnik']].map(x=>`<div class=row><img src="${IMG[x[0]]}"><div><b>${x[1]}</b><br><small>${x[2]}</small></div><button onclick="toast('Wybrano '+ '${x[1]}');hidePanel()">WYBIERZ</button></div>`).join(''))};
class Base extends Phaser.Scene{constructor(key){super(key)}preload(){for(const [k,u] of Object.entries(IMG))this.load.image(k,u)}scale(){const w=this.scale.width,h=this.scale.height;return{x:w,y:h}}iso(gx,gy){const tw=Math.min(82,this.scale.width/5.5),th=tw/2;return{x:(gx-gy)*tw/2+this.scale.width/2,y:(gx+gy)*th/2+80}}}
class Settlement extends Base{constructor(){super('Settlement')}create(){const s=this.scale();this.cameras.main.setBackgroundColor('#273226');this.drawGround();this.add.text(18,75,'OSADA BEBOKÓW',{fontFamily:'Arial',fontSize:24,fontStyle:'bold',color:'#ead8b3'}).setDepth(100);this.add.text(18,103,'Klikaj budynki. Rozwijaj bazę. Przygotuj drużynę.',{fontSize:13,color:'#b8aa90'}).setDepth(100);this.building(0,2,'🏠','SIEDZIBA',()=>toast('To serce osady'));this.building(-2,5,'⛏️','KOPALNIA',()=>this.upgrade('Kopalnia'));this.building(2,5,'🔧','WARSZTAT',()=>this.upgrade('Warsztat'));this.building(-2,8,'🏮','LATARNIA',()=>this.upgrade('Latarnia'));this.building(2,8,'🐾','SCHRONISKO',()=>toast('Tutaj mieszkają uratowane pieski'));this.characters();this.add.text(s.x-145,s.y-65,'→ MAPA KATOWIC',{fontSize:16,fontStyle:'bold',color:'#e4c77f'}).setDepth(100);const gate=this.add.rectangle(s.x,s.y-42,220,55,0x35291d,.95).setStrokeStyle(2,0xb58a48).setInteractive({useHandCursor:true});gate.on('pointerdown',()=>sceneButton('mission'));this.add.text(s.x,s.y-50,'🚪 WYRUSZ NA WYPRAWĘ',{fontSize:15,fontStyle:'bold',color:'#f3dfb1'}).setOrigin(.5).setDepth(101)}drawGround(){const s=this.scale();for(let y=0;y<11;y++)for(let x=0;x<8;x++){const p=this.iso(x,y);const c=(x+y)%2?0x526344:0x5e7050;this.add.polygon(p.x,p.y,[0,-18,40,0,0,18,-40,0],c,.95).setStrokeStyle(1,0x73835f,.5)}}building(gx,gy,icon,name,fn){const p=this.iso(gx,gy);const shadow=this.add.ellipse(p.x,p.y+24,100,30,0x000000,.25);const box=this.add.rectangle(p.x,p.y-25,110,95,0x392d20,.98).setStrokeStyle(2,0xb08a4b);box.setInteractive({useHandCursor:true});box.on('pointerdown',fn);this.add.text(p.x,p.y-43,icon,{fontSize:36}).setOrigin(.5).setDepth(20);this.add.text(p.x,p.y+18,name,{fontSize:12,fontStyle:'bold',color:'#f0dfbc'}).setOrigin(.5).setDepth(21)}characters(){[['hanys',-1,3],['hopla',0,4],['fachura',1,3],['podciep',0,6]].forEach(([k,x,y])=>{const p=this.iso(x,y);this.add.image(p.x,p.y-30,k).setScale(.17).setOrigin(.5,1).setDepth(50+y)})}upgrade(n){if(state.coins<100){toast('Brakuje monet');return}state.coins-=100;state.ore+=20;save();toast(n+' ulepszony! +20 rudy')}}
class Mission extends Base{constructor(){super('Mission')}create(){const s=this.scale();this.cameras.main.setBackgroundColor('#252018');this.add.text(18,75,'MISJA 01 · PIWNICE KAMIENICY',{fontSize:22,fontStyle:'bold',color:'#ead8b3'});this.add.text(18,105,'🐕 Pies wyczuwa coś pod ziemią.',{fontSize:14,color:'#c9b999'});for(let y=0;y<7;y++)for(let x=0;x<5;x++){const px=70+x*100,py=170+y*65;this.add.rectangle(px,py,92,58,(x+y)%2?0x4b4033:0x55493b).setStrokeStyle(1,0x77634c,.7)}this.add.circle(100,550,42,0x1b1712).setStrokeStyle(2,0xb08a4b);this.add.text(100,550,'🐶',{fontSize:34}).setOrigin(.5);this.add.text(100,595,'PIESEK',{fontSize:11,color:'#ead8b3'}).setOrigin(.5);[['hanys',210,400],['hopla',300,330],['fachura',390,400],['podciep',480,330]].forEach(([k,x,y])=>this.add.image(x,y,k).setScale(.18).setOrigin(.5,1));const actions=[['⛏️','KOP','Hanys',()=>this.action('Hanys przebija zawał!')],['🪢','ZWIAD','Hopla znajduje ślad! ',()=>this.action('Hopla znalazła ślad pieska!')],['🔧','NAPRAW','Fachura uruchamia mechanizm!',()=>this.action('Fachura otworzyła przejście!')],['🏮','ŚWIATŁO','Podciep odkrywa sekret!',()=>this.action('Podciep oświetlił ukryte przejście!')]];actions.forEach((a,i)=>{const b=this.add.rectangle(82+i*115,s.y-60,100,50,0x251d15).setStrokeStyle(2,0x806233).setInteractive({useHandCursor:true});this.add.text(b.x,b.y-5,a[0]+' '+a[1],{fontSize:13,fontStyle:'bold',color:'#e6c476'}).setOrigin(.5);b.on('pointerdown',a[3])});this.add.text(18,s.y-125,'CEL: wykonaj 3 działania, aby dotrzeć do pieska.',{fontSize:13,color:'#b8aa90'})}action(t){state.actions++;state.ore+=5;save();toast(t);if(state.actions>=3){state.actions=0;state.dogs=Math.min(10,state.dogs+1);state.coins+=120;save();setTimeout(()=>toast('🎉 Piesek uratowany! +120 monet'),500)}}}
const config={type:Phaser.AUTO,parent:'game',backgroundColor:'#0b0907',scale:{mode:Phaser.Scale.RESIZE,width:'100%',height:'100%'},scene:[Settlement,Mission],render:{antialias:true,pixelArt:false},input:{activePointers:3}};const game=new Phaser.Game(config);game.events.once('ready',()=>game.scene.start(state.scene==='mission'?'Mission':'Settlement'));
</script></body></html>
