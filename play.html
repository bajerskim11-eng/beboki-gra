<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11100d"><title>Beboki — Gra</title><style>:root{--bg:#0d0b08;--panel:#1b1712;--line:#70562f;--gold:#e0b763;--text:#f4ead8;--muted:#b4a58c;--green:#61783a}*{box-sizing:border-box}html,body{margin:0;background:#070605;color:var(--text);font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}.app{width:min(100%,520px);min-height:100dvh;margin:auto;background:radial-gradient(circle at 50% 0,#4b3b27,#100d09 55%);position:relative}.screen{min-height:100dvh;padding:12px 12px 94px}.hero{text-align:center;padding:52px 10px 28px}.logo{font-size:48px;font-weight:1000;letter-spacing:5px;text-shadow:0 4px #332515}.sub{color:var(--gold);font-weight:900;letter-spacing:2px}.muted{color:var(--muted);line-height:1.45}.top{display:flex;align-items:center;gap:9px;background:#15120fee;border:1px solid var(--line);border-radius:16px;padding:7px;position:sticky;top:8px;z-index:20}.top img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--gold);background:#30271e}.stats{display:flex;justify-content:space-around;flex:1;font-size:10px;color:var(--muted)}.stats b{display:block;color:#fff;font-size:14px}.card{background:#1b1712f2;border:1px solid var(--line);border-radius:16px;padding:14px;margin:11px 0;box-shadow:0 8px 22px #0006}.btn{display:block;width:100%;border:1px solid #806233;border-radius:13px;padding:14px;margin:8px 0;background:linear-gradient(#667e3b,#3c5124);color:#fff;font-weight:900}.gold{background:linear-gradient(#dfb762,#8f642b);color:#21170c}.ghost{background:#17130f}.title{font-size:26px;font-weight:1000;margin:18px 2px 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.building{padding:0;overflow:hidden;min-height:200px;text-align:left}.building img{display:block;width:100%;height:150px;object-fit:cover;object-position:top;background:#33291f}.building .label{padding:11px;font-weight:900}.scene img{display:block;width:100%;height:340px;object-fit:cover;object-position:top;border-radius:12px;background:#33291f}.bar{height:8px;background:#392f23;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#7f9849}.map{height:480px;border-radius:17px;border:1px solid var(--line);position:relative;overflow:hidden;background:radial-gradient(circle at 25% 25%,#839078,#53664d 35%,#3d4b3a 65%,#756247)}.map:before{content:'KATOWICE';position:absolute;left:15px;bottom:15px;font-size:34px;font-weight:1000;color:#fff4;letter-spacing:2px}.pin{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:#302316;color:#fff;font-size:25px;box-shadow:0 0 0 7px #d8ad5b22}.p1{left:23%;top:28%}.p2{left:61%;top:51%}.p3{left:42%;top:72%}.mission{display:flex;align-items:center;gap:10px}.mission .btn{width:auto;margin:0;white-space:nowrap}.combat{height:500px;border-radius:17px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(#1b1916,#5a4937 62%,#19110b)}.rocks{position:absolute;left:0;bottom:125px;width:48%;height:90px;background:#554838;border:2px solid #77634b;border-radius:40%}.char{position:absolute;bottom:100px;width:25%;text-align:center}.char img{display:inline-block;width:82px;height:140px;object-fit:cover;object-position:top;border-radius:12px;filter:drop-shadow(0 8px 6px #0009);background:#33291f}.c1{left:0}.c2{left:25%;bottom:135px}.c3{left:50%;bottom:108px}.c4{left:75%;bottom:135px}.dog{position:absolute;right:28px;bottom:58px;font-size:56px}.tools{position:absolute;left:9px;right:9px;bottom:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tools button{height:56px;border-radius:12px;border:1px solid #806033;background:#211b15;color:#e6c476;font-size:24px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);background:#11100ff8;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.bottom button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:900}.bottom button.active{color:#f0c76b}.bottom span{display:block;font-size:20px;margin-bottom:2px}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0e0c09;color:#fff;margin:5px 0 12px}.status{font-size:11px;color:#8e806b;text-align:center;margin-top:12px}</style></head><body><main id="app" class="app"></main><script>const IMG={hanys:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game-v2.jpg?v=1787895276',hopla:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game-v2.jpg?v=1787895284',fachura:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game-v2.jpg?v=1787895293',podciep:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game-v2.jpg?v=1787895302'};const app=document.getElementById('app');let state={page:'start',coins:500,ore:120,dogs:0,xp:0};try{Object.assign(state,JSON.parse(localStorage.getItem('beboki-v2')||'{}'))}catch(e){}function save(){localStorage.setItem('beboki-v2',JSON.stringify(state))}function go(p){state.page=p;save();render()}function image(src,extra=''){return `<img src="${src}" ${extra} loading="eager" decoding="async" onerror="this.style.opacity=.35;this.alt='Bebok'">`}function header(){return `<div class="top">${image(IMG.podciep)}<div class="stats"><div><b>${state.coins}</b>monety</div><div><b>${state.ore}</b>ruda</div><div><b>${state.dogs}/10</b>psy</div></div><span>⚙️</span></div>`}function nav(a){return `<nav class="bottom">${[['settlement','🏠','Osada'],['map','🗺️','Mapa'],['team','👥','Drużyna'],['missions','📜','Misje'],['inventory','🎒','Ekwipunek']].map(x=>`<button class="${a===x[0]?'active':''}" data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function start(){return `<section class="screen"><div class="hero"><div class="logo">BEBOKI</div><div class="sub">STRAŻNICY KATOWIC</div><p class="muted">Zbuduj osadę. Zbierz drużynę. Ruszaj w teren.</p><button class="btn gold" data-go="login">ZAGRAJ</button><button class="btn ghost" data-go="login">ZALOGUJ SIĘ</button><button class="btn ghost" data-go="settlement">GRAJ JAKO GOŚĆ</button></div><div class="card"><b>🐕 Pierwsza misja</b><p class="muted">Pies wyczuwa coś w starej piwnicy. Beboki muszą sprawdzić, co się dzieje.</p></div><div class="status">Wersja testowa · grafiki z Shopify CDN</div></section>`}function login(){return `<section class="screen"><div class="hero"><div class="logo">BEBOKI</div><div class="sub">WEJDŹ DO GRY</div></div><div class="card"><label>E-MAIL</label><input type="email"><label>HASŁO</label><input type="password"><button class="btn gold" data-go="settlement">WEJDŹ DO OSADY</button></div><button class="btn ghost" data-go="start">WRÓĆ</button></section>`}function settlement(){let b=[['mine',IMG.hanys,'⛏️ Kopalnia Hanysa'],['workshop',IMG.fachura,'🔧 Warsztat Fachury'],['lighthouse',IMG.podciep,'🏮 Latarnia Podciepa'],['shelter',IMG.hopla,'🐾 Schronisko']];return `<section class="screen">${header()}<div class="title">OSADA BEBOKÓW</div><p class="muted">Tu rozwijasz bazę i przygotowujesz wyprawy.</p><div class="card"><b>🐕 Uratowane psy: ${state.dogs}/10</b><div class="bar"><i style="width:${state.dogs*10}%"></i></div><button class="btn gold" data-go="map">🗺️ WYRUSZ NA MAPĘ</button></div><div class="grid">${b.map(x=>`<button class="card building" data-go="${x[0]}">${image(x[1])}<div class="label">${x[2]}</div></button>`).join('')}</div></section>${nav('settlement')}`}function building(type){let d={mine:['KOPALNIA HANYSA',IMG.hanys,'Hanys kopie i buduje przejścia.','⛏️ KOP'],workshop:['WARSZTAT FACHURY',IMG.fachura,'Fachura tworzy sprzęt dla osady.','🔧 BUDUJ'],lighthouse:['LATARNIA PODCIEPA',IMG.podciep,'Podciep odkrywa ukryte przejścia.','🏮 ODKRYJ'],shelter:['SCHRONISKO DLA PSÓW',IMG.hopla,'Tutaj trafiają uratowane psy.','🐕 OPIEKA']}[type];return `<section class="screen">${header()}<button class="btn ghost" data-go="settlement">← OSADA</button><div class="card scene">${image(d[1])}<h2>${d[0]}</h2><p class="muted">${d[2]}</p><button class="btn gold" data-upgrade="1">${d[3]}</button></div></section>`}function map(){return `<section class="screen">${header()}<div class="title">MAPA KATOWIC</div><div class="map"><button class="pin p1" data-go="mission">🐾</button><button class="pin p2">⛏️</button><button class="pin p3">🏮</button></div><div class="card mission"><div style="font-size:30px">🐕</div><div style="flex:1"><b>Piwnice kamienicy</b><div class="muted">Pies wyczuwa coś pod ziemią.</div></div><button class="btn gold" data-go="mission">WEJDŹ</button></div></section>${nav('map')}`}function mission(){return `<section class="screen">${header()}<button class="btn ghost" data-go="map">← MAPA</button><div class="hero"><div class="title">PIWNICE KAMIENICY</div><p class="muted">Coś ukrywa się za zawałem. Wybierz drużynę.</p></div><div class="card"><b>CEL</b><p>🐕 Uratuj pieska</p><p>🦴 Znajdź 6 kości</p><p>🔮 Odkryj sekret</p><button class="btn gold" data-go="team">WYBIERZ DRUŻYNĘ</button></div></section>`}function team(){return `<section class="screen">${header()}<div class="title">DRUŻYNA</div>${[['hanys','Hanys','Budowniczy'],['hopla','Hopla','Zwiadowczyni'],['fachura','Fachura','Wynalazca'],['podciep','Podciep','Latarnik']].map(x=>`<div class="card mission">${image(IMG[x[0]],'style="width:62px;height:82px;object-fit:cover;object-position:top;border-radius:10px"')}<div><b>${x[1]}</b><div class="muted">${x[2]}</div></div></div>`).join('')}<button class="btn gold" data-go="gameplay">START WYPRAWY</button></section>${nav('team')}`}function gameplay(){return `<section class="screen">${header()}<div class="combat"><div class="rocks"></div>${[['hanys','c1'],['hopla','c2'],['fachura','c3'],['podciep','c4']].map(x=>`<div class="char ${x[1]}">${image(IMG[x[0]])}</div>`).join('')}<div class="dog">🐶</div><div class="tools"><button data-action="mine">⛏️</button><button data-action="scout">🪢</button><button data-action="build">🔧</button><button data-action="light">🏮</button></div></div><div class="card"><b id="message">Coś jest za tym zawałem…</b><p class="muted">Wykonaj trzy akcje Beboków. Wtedy dotrzemy do pieska.</p></div></section>`}function inventory(){return `<section class="screen">${header()}<div class="title">EKWIPUNEK</div>${['⛏️ Narzędzia','🔧 Części','🏮 Latarnia','🦴 Kości','💎 Kryształy','🗝️ Klucze'].map(x=>`<div class="card">${x}</div>`).join('')}</section>${nav('inventory')}`}function missions(){return `<section class="screen">${header()}<div class="title">MISJE</div><div class="card mission"><div>🐾</div><div style="flex:1"><b>Piwnice kamienicy</b><div class="muted">Pies wyczuwa coś pod ziemią.</div></div><button class="btn gold" data-go="mission">WYRUSZ</button></div><div class="card">🔒 Zaginiony piesek — wkrótce</div><div class="card">🔒 Stara kopalnia — wkrótce</div></section>${nav('missions')}`}function render(){let p=state.page;app.innerHTML=p==='start'?start():p==='login'?login():p==='settlement'?settlement():['mine','workshop','lighthouse','shelter'].includes(p)?building(p):p==='map'?map():p==='mission'?mission():p==='team'?team():p==='gameplay'?gameplay():p==='inventory'?inventory():p==='missions'?missions():start()}app.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}if(e.target.closest('[data-upgrade]')){state.coins+=50;state.ore=Math.max(0,state.ore-20);save();render();return}let a=e.target.closest('[data-action]');if(a){state.xp+=10;if(a.dataset.action==='mine')state.ore+=5;let msgs={mine:'Hanys przebija zawał!',scout:'Hopla znalazła ślad pieska!',build:'Fachura uruchamia mechanizm!',light:'Podciep odkrywa ukryte przejście!'};let m=document.getElementById('message');if(m)m.textContent=msgs[a.dataset.action];if(state.xp>=30){state.dogs=Math.min(10,state.dogs+1);state.coins+=120;state.ore+=5;state.xp=0;save();setTimeout(()=>go('settlement'),500)}else save()}});render();</script></body></html>
