<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17130e"><title>Beboki — Gra</title><style>:root{--bg:#0b0907;--panel:#1b1712;--line:#70562f;--gold:#e2b65d;--text:#f5ead6;--muted:#b6a68c;--green:#647d3a}*{box-sizing:border-box}html,body{margin:0;background:#070605;color:var(--text);font-family:Arial,sans-serif}button{font:inherit;cursor:pointer;color:inherit}.app{width:min(100%,540px);min-height:100dvh;margin:auto;background:radial-gradient(circle at 50% 0,#4b3b27,#100d09 52%,#090705);position:relative}.screen{min-height:100dvh;padding:12px 12px 96px}.hero{text-align:center;padding:48px 10px 28px}.logo{font-size:49px;font-weight:1000;letter-spacing:5px;text-shadow:0 4px #332515}.sub{color:var(--gold);font-weight:900;letter-spacing:2px}.muted{color:var(--muted);line-height:1.45}.top{display:flex;align-items:center;gap:9px;background:#15120fee;border:1px solid var(--line);border-radius:16px;padding:7px;position:sticky;top:8px;z-index:20;backdrop-filter:blur(8px)}.top img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--gold);background:#30271e}.stats{display:flex;justify-content:space-around;flex:1;font-size:10px;color:var(--muted)}.stats b{display:block;color:#fff;font-size:14px}.card{background:#1b1712f2;border:1px solid var(--line);border-radius:16px;padding:14px;margin:11px 0;box-shadow:0 8px 22px #0006}.btn{display:block;width:100%;border:1px solid #806233;border-radius:13px;padding:14px;margin:8px 0;background:linear-gradient(#667e3b,#3c5124);font-weight:900}.gold{background:linear-gradient(#dfb762,#8f642b);color:#21170c}.ghost{background:#17130f}.title{font-size:26px;font-weight:1000;margin:18px 2px 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.building{padding:0;overflow:hidden;min-height:195px;text-align:left;background:#1b1712}.building img{display:block;width:100%;height:150px;object-fit:cover;object-position:top;background:#33291f}.building .label{padding:11px;font-weight:900}.scene img{display:block;width:100%;height:340px;object-fit:cover;object-position:top;border-radius:12px;background:#33291f}.bar{height:8px;background:#392f23;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#7f9849}.mission{display:flex;align-items:center;gap:10px}.mission .btn{width:auto;margin:0;white-space:nowrap}.map{height:480px;border-radius:17px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(145deg,#718267,#40533f 45%,#6f6047)}.map:before{content:'KATOWICE';position:absolute;left:15px;bottom:15px;font-size:34px;font-weight:1000;color:#fff3;letter-spacing:2px}.road{position:absolute;background:#8e8068aa;border:1px solid #c8b99a44;transform:rotate(-28deg);height:28px;border-radius:20px}.road.a{width:120%;left:-10%;top:36%}.road.b{width:100%;left:5%;top:61%;transform:rotate(18deg)}.road.c{width:70%;left:18%;top:20%;transform:rotate(67deg)}.pin{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:#302316;color:#fff;font-size:25px;box-shadow:0 0 0 7px #d8ad5b22}.p1{left:23%;top:28%}.p2{left:61%;top:51%}.p3{left:42%;top:72%}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,540px);display:grid;grid-template-columns:repeat(5,1fr);background:#11100ff8;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.bottom button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:900}.bottom button.active{color:#f0c76b}.bottom span{display:block;font-size:20px;margin-bottom:2px}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0e0c09;color:#fff;margin:5px 0 12px}.status{font-size:11px;color:#8e806b;text-align:center;margin-top:12px}.missionMap{height:540px;border:1px solid var(--line);border-radius:17px;position:relative;overflow:hidden;background:linear-gradient(#171513,#3e3429 52%,#16100c);touch-action:manipulation}.ceiling{position:absolute;top:0;left:0;right:0;height:80px;background:repeating-linear-gradient(35deg,#28231d 0 20px,#332a21 20px 40px);border-bottom:4px solid #4c3c2b}.water{position:absolute;left:0;right:0;bottom:95px;height:45px;background:#4d6d73aa;border-top:2px solid #87a9a4}.wall{position:absolute;background:#54463a;border:2px solid #6f5b48;border-radius:14px;box-shadow:inset 0 0 20px #0005}.wall.w1{left:-20px;top:205px;width:190px;height:105px;transform:rotate(-7deg)}.wall.w2{right:-25px;top:280px;width:205px;height:100px;transform:rotate(9deg)}.wall.w3{left:120px;top:125px;width:110px;height:80px;transform:rotate(12deg)}.target{position:absolute;left:78%;top:66%;font-size:44px;filter:drop-shadow(0 4px 5px #000);transition:.4s}.bone{position:absolute;font-size:24px;transition:all .35s;z-index:5;user-select:none}.b1{left:34%;top:57%}.b2{left:52%;top:38%}.b3{left:68%;top:47%}.b4{left:43%;top:72%}.b5{left:20%;top:41%}.b6{left:76%;top:29%}.sprite{position:absolute;width:74px;height:108px;z-index:8;transition:left .7s ease,top .7s ease;user-select:none;touch-action:none}.sprite img{width:68px;height:92px;object-fit:cover;object-position:top;border-radius:11px;filter:drop-shadow(0 7px 5px #000b);background:#33291f}.sprite .name{font-size:9px;font-weight:900;background:#16120ee8;border:1px solid #604b30;border-radius:8px;padding:3px 5px;display:inline-block;margin-top:-2px}.s1{left:7%;top:67%}.s2{left:20%;top:75%}.s3{left:7%;top:80%}.s4{left:31%;top:70%}.actionbar{position:absolute;left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:15}.actionbar button{height:58px;border-radius:12px;border:1px solid #806033;background:#211b15eF;color:#e6c476;font-size:22px}.actionbar small{display:block;font-size:8px;color:#c9b99b;margin-top:2px}.objective{display:flex;gap:10px;align-items:center}.objective .big{font-size:32px}.toast{position:absolute;left:12px;right:12px;top:92px;background:#f0dfbc;color:#302519;border-radius:13px;padding:10px;font-size:12px;font-weight:800;z-index:25;box-shadow:0 8px 20px #0007;opacity:0;transform:translateY(-10px);transition:.25s}.toast.show{opacity:1;transform:none}.win{position:absolute;inset:0;background:#120e0aeF;display:grid;place-items:center;text-align:center;z-index:40}.winbox{margin:20px;background:#211b15;border:1px solid var(--gold);border-radius:20px;padding:22px;box-shadow:0 20px 60px #000}.winbox .paw{font-size:65px}.choice{display:flex;gap:10px;align-items:center}.choice img{width:58px;height:78px;object-fit:cover;object-position:top;border-radius:10px}.choice button{margin-left:auto;width:auto;padding:10px}.disabled{opacity:.5}.tip{font-size:11px;color:#c7b894;background:#251e16;border-radius:10px;padding:8px;margin-top:8px}@media(min-width:700px){body{padding:20px}.app{border-radius:25px;box-shadow:0 0 60px #000}}</style></head><body><main id="app" class="app"></main><script>const IMG={hanys:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game-v2.jpg?v=1787895276',hopla:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game-v2.jpg?v=1787895284',fachura:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game-v2.jpg?v=1787895293',podciep:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game-v2.jpg?v=1787895302'};const app=document.getElementById('app');let state={page:'start',coins:500,ore:120,dogs:0,xp:0,bones:0,missionDone:false};try{Object.assign(state,JSON.parse(localStorage.getItem('beboki-v3')||'{}'))}catch(e){}function save(){localStorage.setItem('beboki-v3',JSON.stringify(state))}function go(p){state.page=p;state.xp=p==='gameplay'?0:state.xp;state.bones=p==='gameplay'?0:state.bones;save();render()}function image(src,extra=''){return `<img src="${src}" ${extra} loading="eager" decoding="async" onerror="this.style.opacity=.35;this.alt='Bebok'">`}function header(){return `<div class="top">${image(IMG.podciep)}<div class="stats"><div><b>${state.coins}</b>monety</div><div><b>${state.ore}</b>ruda</div><div><b>${state.dogs}/10</b>psy</div></div><span>⚙️</span></div>`}function nav(a){return `<nav class="bottom">${[['settlement','🏠','Osada'],['map','🗺️','Mapa'],['team','👥','Drużyna'],['missions','📜','Misje'],['inventory','🎒','Ekwipunek']].map(x=>`<button class="${a===x[0]?'active':''}" data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function start(){return `<section class="screen"><div class="hero"><div class="logo">BEBOKI</div><div class="sub">STRAŻNICY KATOWIC</div><p class="muted">Zbuduj osadę. Zbierz drużynę. Ruszaj w teren.</p><button class="btn gold" data-go="login">ZAGRAJ</button><button class="btn ghost" data-go="login">ZALOGUJ SIĘ</button><button class="btn ghost" data-go="settlement">GRAJ JAKO GOŚĆ</button></div><div class="card"><b>🐕 Pierwsza misja</b><p class="muted">Pies wyczuwa coś w starej piwnicy. Tym razem Beboki naprawdę muszą wejść do środka.</p></div><div class="status">Prototyp v4 · mobilny · zapis lokalny</div></section>`}function login(){return `<section class="screen"><div class="hero"><div class="logo">BEBOKI</div><div class="sub">WEJDŹ DO GRY</div></div><div class="card"><label>E-MAIL</label><input type="email"><label>HASŁO</label><input type="password"><button class="btn gold" data-go="settlement">WEJDŹ DO OSADY</button></div><button class="btn ghost" data-go="start">WRÓĆ</button></section>`}function settlement(){let b=[['mine',IMG.hanys,'⛏️ Kopalnia Hanysa'],['workshop',IMG.fachura,'🔧 Warsztat Fachury'],['lighthouse',IMG.podciep,'🏮 Latarnia Podciepa'],['shelter',IMG.hopla,'🐾 Schronisko']];return `<section class="screen">${header()}<div class="title">OSADA BEBOKÓW</div><p class="muted">Twoja baza. Rozbudowuj ją, zbieraj zasoby i wysyłaj Beboki na misje.</p><div class="card"><b>🐕 Uratowane psy: ${state.dogs}/10</b><div class="bar"><i style="width:${state.dogs*10}%"></i></div><button class="btn gold" data-go="map">🗺️ WYRUSZ NA MAPĘ</button></div><div class="grid">${b.map(x=>`<button class="card building" data-go="${x[0]}">${image(x[1])}<div class="label">${x[2]}</div></button>`).join('')}</div></section>${nav('settlement')}`}function building(type){let d={mine:['KOPALNIA HANYSA',IMG.hanys,'Hanys wydobywa rudę i potrafi przebić się przez zawały.','⛏️ KOP GŁĘBIEJ'],workshop:['WARSZTAT FACHURY',IMG.fachura,'Fachura buduje sprzęt potrzebny do wypraw.','🔧 BUDUJ'],lighthouse:['LATARNIA PODCIEPA',IMG.podciep,'Podciep oświetla miejsca, których zwykła latarnia nie widzi.','🏮 ODKRYJ'],shelter:['SCHRONISKO DLA PSÓW',IMG.hopla,'Tutaj trafiają wszystkie pieski, które uratujemy w terenie.','🐕 OPIEKA']}[type];return `<section class="screen">${header()}<button class="btn ghost" data-go="settlement">← OSADA</button><div class="card scene">${image(d[1])}<h2>${d[0]}</h2><p class="muted">${d[2]}</p><button class="btn gold" data-upgrade="1">${d[3]}</button></div><div class="tip">Budynki będą miały poziomy, produkcję zasobów i własne animacje.</div></section>`}function map(){return `<section class="screen">${header()}<div class="title">MAPA KATOWIC</div><div class="map"><div class="road a"></div><div class="road b"></div><div class="road c"></div><button class="pin p1" data-go="mission">🐾</button><button class="pin p2">⛏️</button><button class="pin p3">🏮</button></div><div class="card mission"><div style="font-size:30px">🐕</div><div style="flex:1"><b>Piwnice kamienicy</b><div class="muted">Aktywna misja. Pies nie chce odejść od wejścia.</div></div><button class="btn gold" data-go="mission">WEJDŹ</button></div></section>${nav('map')}`}function mission(){return `<section class="screen">${header()}<button class="btn ghost" data-go="map">← MAPA</button><div class="hero" style="padding:26px 8px"><div class="title">PIWNICE KAMIENICY</div><p class="muted">Coś jest za zawałem. Wybierz Beboki, które poprowadzą wyprawę.</p></div><div class="card"><b>CEL MISJI</b><p>🐕 Uratuj pieska</p><p>🦴 Zbierz 6 kości</p><p>🔮 Znajdź ukryte przejście</p></div><div class="card">${[['hanys','Hanys','Przebija zawały'],['hopla','Hopla','Znajduje drogę'],['fachura','Fachura','Uruchamia mechanizmy'],['podciep','Podciep','Oświetla sekrety']].map(x=>`<div class="choice">${image(IMG[x[0]],'style="width:58px;height:78px;object-fit:cover;object-position:top;border-radius:10px"')}<div><b>${x[1]}</b><div class="muted">${x[2]}</div></div><span>✓</span></div>`).join('')}<button class="btn gold" data-go="gameplay">ROZPOCZNIJ WYPRAWĘ</button></div></section>`}function team(){return `<section class="screen">${header()}<div class="title">DRUŻYNA</div>${[['hanys','Hanys','Budowniczy — zawały'],['hopla','Hopla','Zwiadowczyni — ścieżki'],['fachura','Fachura','Wynalazca — mechanizmy'],['podciep','Podciep','Latarnik — sekrety']].map(x=>`<div class="card mission">${image(IMG[x[0]],'style="width:62px;height:82px;object-fit:cover;object-position:top;border-radius:10px"')}<div><b>${x[1]}</b><div class="muted">${x[2]}</div></div></div>`).join('')}<button class="btn gold" data-go="mission">IDŹ NA MISJĘ</button></section>${nav('team')}`}function gameplay(){return `<section class="screen">${header()}<div class="card objective"><div class="big">🐕</div><div style="flex:1"><b>URATUJ PIESKA</b><div class="muted"><span id="bones">${state.bones}</span>/6 kości · akcje <span id="steps">${state.xp}</span>/3</div></div></div><div class="missionMap" id="missionMap"><div class="ceiling"></div><div class="wall w1"></div><div class="wall w2"></div><div class="wall w3"></div><div class="water"></div><div class="target" id="target">🐶</div>${[1,2,3,4,5,6].map(n=>`<div class="bone b${n}" data-bone="1">🦴</div>`).join('')}${[['hanys','s1','Hanys'],['hopla','s2','Hopla'],['fachura','s3','Fachura'],['podciep','s4','Podciep']].map(x=>`<div class="sprite ${x[1]}" data-char="${x[0]}">${image(IMG[x[0]])}<div class="name">${x[2]}</div></div>`).join('')}<div class="toast" id="toast"></div><div class="actionbar"><button data-action="mine">⛏️<small>KOP</small></button><button data-action="scout">🪢<small>PROWADŹ</small></button><button data-action="build">🔧<small>NAPRAW</small></button><button data-action="light">🏮<small>OŚWIETL</small></button></div></div><div class="card"><b id="missionMsg">Zawał blokuje przejście.</b><p class="muted">Klikaj umiejętności. Beboki przesuwają się po planszy. Kliknij kość, żeby ją zebrać.</p></div><button class="btn ghost" data-go="mission">← PRZERWIJ MISJĘ</button></section>`}function inventory(){return `<section class="screen">${header()}<div class="title">EKWIPUNEK</div><div class="grid">${['⛏️ Kilof','🪢 Lina','🔧 Części','🏮 Latarnia','🦴 Kości','💎 Kryształ','🗝️ Klucz','🧪 Eliksir'].map(x=>`<div class="card" style="text-align:center;font-weight:800">${x}</div>`).join('')}</div></section>${nav('inventory')}`}function missions(){return `<section class="screen">${header()}<div class="title">MISJE</div><div class="card mission"><div>🐾</div><div style="flex:1"><b>Piwnice kamienicy</b><div class="muted">Uratuj pierwszego pieska.</div></div><button class="btn gold" data-go="mission">WYRUSZ</button></div><div class="card disabled">🐾 Zaginiony piesek — odblokuj po misji 1</div><div class="card disabled">⛏️ Stara kopalnia — odblokuj po rozbudowie osady</div></section>${nav('missions')}`}function showToast(t){let e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1500)}function action(type){let m={mine:['Hanys','Hanys przebija zawał!','⛏️'],scout:['Hopla','Hopla znalazła ślad pieska!','🪢'],build:['Fachura','Fachura uruchamia mechanizm!','🔧'],light:['Podciep','Podciep odkrywa ukryte przejście!','🏮']}[type];showToast(m[2]+' '+m[1]);let cls={mine:'s1',scout:'s2',build:'s3',light:'s4'}[type],el=document.querySelector('.'+cls);if(el){el.style.left=(34+Math.random()*38)+'%';el.style.top=(27+Math.random()*38)+'%'}state.xp=Math.min(3,state.xp+1);if(type==='mine')state.ore+=5;document.getElementById('steps').textContent=state.xp;document.getElementById('missionMsg').textContent=m[1];if(type==='mine')document.querySelector('.w1').style.opacity=.2;if(type==='scout')document.getElementById('target').style.filter='drop-shadow(0 0 12px #e8c86c)';if(type==='build')document.querySelector('.w3').style.opacity=.25;if(type==='light')document.getElementById('missionMap').style.background='radial-gradient(circle at 70% 40%,#8b734a88,transparent 28%),linear-gradient(#29231d,#5a4937 55%,#19120d)';save();if(state.xp>=3){showToast('🎉 Droga do pieska otwarta!');setTimeout(()=>finish(),700)}}function finish(){if(state.missionDone)return;state.missionDone=true;state.dogs=Math.min(10,state.dogs+1);state.coins+=120;state.ore+=25;state.xp=0;save();go('reward')}function reward(){return `<section class="screen"><div class="hero"><div style="font-size:65px">🐾</div><div class="title">MISJA WYKONANA!</div><p class="muted">Piesek jest bezpieczny. Drużyna wraca do osady.</p></div><div class="card" style="text-align:center">${image(IMG.hopla,'style="width:170px;height:220px;object-fit:cover;object-position:top;border-radius:15px"')}<p><b>„Mamy go!” ❤️</b></p></div><div class="card"><b>NAGRODY</b><p>🪙 +120 monet</p><p>⛏️ +25 rudy</p><p>🐕 +1 uratowany pies</p></div><button class="btn gold" data-go="settlement">WRÓĆ DO OSADY</button></section>`}function render(){let p=state.page;app.innerHTML=p==='start'?start():p==='login'?login():p==='settlement'?settlement():['mine','workshop','lighthouse','shelter'].includes(p)?building(p):p==='map'?map():p==='mission'?mission():p==='team'?team():p==='gameplay'?gameplay():p==='reward'?reward():p==='inventory'?inventory():p==='missions'?missions():start()}app.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}if(e.target.closest('[data-upgrade]')){state.coins+=50;state.ore=Math.max(0,state.ore-20);save();showToast('🔨 Ulepszenie rozpoczęte');return}let a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}let bone=e.target.closest('[data-bone]');if(bone&&bone.dataset.bone==='1'){bone.dataset.bone='0';bone.style.transform='scale(0) rotate(90deg)';bone.style.opacity='0';state.bones=Math.min(6,state.bones+1);let el=document.getElementById('bones');if(el)el.textContent=state.bones;showToast('🦴 Znaleziono kość!');save()}});render();</script></body></html>
