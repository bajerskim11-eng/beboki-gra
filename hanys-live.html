<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanys AI — 3D Avatar</title><style>html,body{margin:0;height:100%;background:#080b08;color:#f5f5ef;font-family:system-ui,sans-serif}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:1fr 360px}.stage{position:relative;min-width:0}.brand{position:absolute;z-index:2;top:22px;left:24px;font-weight:900;letter-spacing:.12em}.brand span{display:block;font-size:12px;opacity:.55;letter-spacing:.04em;margin-top:4px}.panel{background:#151a13;border-left:1px solid #2d3628;padding:24px;display:flex;flex-direction:column}.panel h1{margin:0 0 6px;font-size:28px}.status{font-size:13px;opacity:.65;margin-bottom:18px}.chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px}.msg{padding:11px 13px;border-radius:14px;line-height:1.4;max-width:90%;white-space:pre-wrap}.bot{background:#283323}.user{background:#4d6a36;align-self:flex-end}.row{display:flex;gap:8px;margin-top:14px}.row input{flex:1;background:#0b0e0a;color:#fff;border:1px solid #3a4434;border-radius:12px;padding:12px}.row button{border:0;border-radius:12px;background:#9bc66b;padding:12px 16px;font-weight:800;cursor:pointer}.note{font-size:11px;opacity:.45;margin-top:12px;line-height:1.45}canvas{width:100%;height:100%;display:block}.hint{position:absolute;bottom:22px;left:24px;z-index:2;opacity:.5;font-size:12px}</style></head><body><div class="app"><main class="stage"><div class="brand">BEBOKI<span>HANYŚ • 3D AI AVATAR</span></div><canvas id="c"></canvas><div class="hint">Przeciągnij myszką • kółko = zoom</div></main><aside class="panel"><h1>Hanys</h1><div id="status" class="status">Uruchamiam avatara…</div><div id="chat" class="chat"><div class="msg bot">Jo je Hanys. 👋<br>Możesz ze mną pogadać.</div></div><div class="row"><input id="q" placeholder="Napisz do Hanysa…"><button id="go">➜</button></div><div class="note">Avatar działa lokalnie w przeglądarce. Obraz Hanysa pochodzi z Twojego Shopify. Warstwa AI może zostać podłączona do NVIDIA/DeepSeek bez przebudowy avatara.</div></aside></div><script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.179.1/examples/js/controls/OrbitControls.js"></script><script>const IMAGE='https://cdn.shopify.com/s/files/1/1019/1903/1622/files/hanys.jpg?v=1787742427';const canvas=document.querySelector('#c'),status=document.querySelector('#status');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x080b08,1);const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(32,1,.1,100);camera.position.set(0,0,5.4);const controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=3;controls.maxDistance=8;scene.add(new THREE.HemisphereLight(0xffffff,0x20251d,2.4));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(3,4,5);scene.add(key);const rim=new THREE.PointLight(0x9bc66b,10,8);rim.position.set(-3,2,3);scene.add(rim);const root=new THREE.Group();scene.add(root);let mesh;function build(){const tex=new THREE.TextureLoader().load(IMAGE,()=>{status.textContent='Hanys 3D online • gotowy';},undefined,()=>{status.textContent='Nie udało się pobrać obrazu Shopify';});tex.colorSpace=THREE.SRGBColorSpace;const geo=new THREE.PlaneGeometry(3.1,4.0,48,64);const pos=geo.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i);const edge=Math.min(1,Math.max(0,(y+2)/4));const bulge=Math.max(0,1-Math.abs(x/1.55))*Math.sin(edge*Math.PI)*0.38;pos.setZ(i,bulge)}geo.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({map:tex,roughness:.72,metalness:.03,side:THREE.DoubleSide});mesh=new THREE.Mesh(geo,mat);root.add(mesh);const back=new THREE.Mesh(new THREE.BoxGeometry(3.12,4.02,.14),new THREE.MeshStandardMaterial({color:0x1b2418,roughness:1}));back.position.z=-.08;root.add(back)}build();let t=0;function animate(){requestAnimationFrame(animate);t+=.016;root.position.y=Math.sin(t*1.5)*.035;root.rotation.y=Math.sin(t*.55)*.045;controls.update();renderer.render(scene,camera)}animate();function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();const chat=document.querySelector('#chat'),q=document.querySelector('#q');function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function send(){const text=q.value.trim();if(!text)return;q.value='';add(text,'user');status.textContent='Hanys myśli…';try{const r=await fetch('/api/nvidia-chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}]})});const d=await r.json();if(!r.ok)throw new Error(d.error||'API niedostępne');add(d.message||'Jo, już odpowiadam.','bot');status.textContent='Hanys online'}catch(e){add('Jo słyszę, ale mój zdalny mózg jeszcze nie odpowiada. Avatar działa — API AI jest następną warstwą.','bot');status.textContent='Hanys 3D online • AI API offline'}}document.querySelector('#go').onclick=send;q.onkeydown=e=>{if(e.key==='Enter')send()};</script></body></html>
