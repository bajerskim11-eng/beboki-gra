<!doctype html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanys AI — Beboki</title><style>*{box-sizing:border-box}body{margin:0;background:#10120f;color:#f5f3e8;font-family:system-ui,sans-serif;overflow:hidden}#app{height:100vh;display:grid;grid-template-columns:1fr 380px}.stage{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}.brand{position:absolute;top:22px;left:24px;z-index:2;font-weight:800;letter-spacing:.08em}.brand small{display:block;opacity:.6;font-weight:500;letter-spacing:0}.panel{background:#181b16;border-left:1px solid #30362b;padding:20px;display:flex;flex-direction:column;gap:14px}.panel h1{font-size:24px;margin:0}.status{font-size:12px;opacity:.65}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}.msg{padding:11px 13px;border-radius:14px;max-width:92%;line-height:1.4;white-space:pre-wrap}.bot{background:#293124;align-self:flex-start}.user{background:#526b39;align-self:flex-end}.controls{display:flex;gap:8px}.controls input{flex:1;min-width:0;background:#0e100d;color:white;border:1px solid #394131;border-radius:12px;padding:12px}.controls button,.mic{border:0;border-radius:12px;padding:12px 14px;background:#89ad58;color:#10120f;font-weight:800;cursor:pointer}.controls button:disabled{opacity:.5;cursor:wait}.mic{width:100%}.mic.active{background:#d0a448}.hint{font-size:11px;opacity:.5;line-height:1.4}</style></head><body><div id="app"><section class="stage"><div class="brand">BEBOKI <small>Hanys AI</small></div><canvas id="avatar"></canvas></section><aside class="panel"><h1>Porozmawiaj z Hansem</h1><div id="status" class="status">Ładowanie avatara…</div><div id="messages" class="messages"><div class="msg bot">Jo je Hanys. Teraz już naprawdę gadom z pomocą NVIDIA. 👋</div></div><div class="controls"><input id="text" placeholder="Napisz do mnie…" autocomplete="off"><button id="send">➜</button></div><button id="mic" class="mic">🎙️ Mów do Hanysa</button><div class="hint">Rozmowa korzysta z bezpiecznego endpointu serwerowego → NVIDIA NIM.</div></aside></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js';const canvas=document.querySelector('#avatar'),status=document.querySelector('#status'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene();scene.background=new THREE.Color(0x10120f),camera=new THREE.PerspectiveCamera(35,1,.1,100);camera.position.set(0,1.5,4.2);const controls=new OrbitControls(camera,canvas);controls.target.set(0,1.25,0);controls.enableDamping=true;controls.enablePan=false;scene.add(new THREE.HemisphereLight(0xcde5b2,0x282015,2.2));const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(3,5,4);scene.add(key);const floor=new THREE.Mesh(new THREE.CircleGeometry(2.4,64),new THREE.MeshStandardMaterial({color:0x24291f,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.02;scene.add(floor);const body=new THREE.Group();scene.add(body);body.position.y=-.95;const green=new THREE.MeshStandardMaterial({color:0x71934c,roughness:.9}),cloth=new THREE.MeshStandardMaterial({color:0x394a30,roughness:1}),brown=new THREE.MeshStandardMaterial({color:0x65482d,roughness:1});function sphere(s,p,m=green){const x=new THREE.Mesh(new THREE.SphereGeometry(s,32,24),m);x.position.set(...p);body.add(x)}function box(s,p,m){const x=new THREE.Mesh(new THREE.BoxGeometry(...s),m);x.position.set(...p);body.add(x)}sphere(.58,[0,1.65,0]);sphere(.22,[-.25,1.72,.48]);sphere(.22,[.25,1.72,.48]);sphere(.09,[-.21,1.74,.67],brown);sphere(.09,[.21,1.74,.67],brown);box([.95,1.15,.55],[0,.75,0],cloth);sphere(.22,[-.72,.85,0]);sphere(.22,[.72,.85,0]);box([.3,.95,.35],[-.28,-.2,0],cloth);box([.3,.95,.35],[.28,-.2,0],cloth);box([.52,.28,.8],[-.28,-.72,.02],brown);box([.52,.28,.8],[.28,-.72,.02],brown);for(let i=0;i<12;i++){const a=i/12*Math.PI*2,h=.45+.18*Math.sin(i*2.7);const hair=sphere(.11,[Math.cos(a)*h,2.1+Math.sin(a)*.15,Math.sin(a)*h],green)}status.textContent='Avatar 3D działa • NVIDIA NIM podłączony';let t=0;function animate(){requestAnimationFrame(animate);t+=.016;body.rotation.y=Math.sin(t*.45)*.08;body.position.y=-.95+Math.sin(t*1.6)*.025;controls.update();renderer.render(scene,camera)}animate();function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();const messages=document.querySelector('#messages'),input=document.querySelector('#text'),send=document.querySelector('#send'),history=[];function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pl-PL';u.rate=.95;speechSynthesis.speak(u)}async function answer(q){history.push({role:'user',content:q});send.disabled=true;status.textContent='Hanys myśli…';try{const response=await fetch('/api/nvidia-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-12)})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Błąd NVIDIA');const a=(data.message||'Nie wiem co powiedzieć.').trim();history.push({role:'assistant',content:a});add(a,'bot');speak(a);status.textContent='NVIDIA NIM online • Hanys słucha'}catch(error){history.pop();add('Kajś mi się po drodze zgubiło. Spróbuj jeszcze raz.','bot');status.textContent='Błąd połączenia z NVIDIA NIM';console.error(error)}finally{send.disabled=false;input.focus()}}document.querySelector('#send').onclick=()=>{const q=input.value.trim();if(!q||send.disabled)return;add(q,'user');input.value='';answer(q)};input.onkeydown=e=>{if(e.key==='Enter')document.querySelector('#send').click()};const mic=document.querySelector('#mic');if('webkitSpeechRecognition'in window||'SpeechRecognition'in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition,rec=new R();rec.lang='pl-PL';rec.continuous=false;rec.interimResults=false;rec.onresult=e=>{input.value=e.results[0][0].transcript;mic.classList.remove('active');document.querySelector('#send').click()};rec.onend=()=>mic.classList.remove('active');mic.onclick=()=>{mic.classList.add('active');rec.start()}}else{mic.disabled=true;mic.textContent='🎙️ Mikrofon niedostępny'}</script></body></html>
