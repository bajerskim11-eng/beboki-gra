<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beboki — Gra Terenowa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#10100f;--paper:#eee7d9;--muted:#8d887d;--gold:#c7a55b;--line:#ffffff18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:Inter,system-ui,sans-serif}#map{height:100svh;min-height:620px;filter:saturate(.75) brightness(.7)}.hud{position:fixed;z-index:10;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.brand,.xp{pointer-events:auto;background:#10100fd9;border:1px solid var(--line);backdrop-filter:blur(18px);padding:11px 14px}.brand b{letter-spacing:.12em;font-size:12px}.xp{font-size:12px}.xp strong{color:var(--gold)}.panel{position:fixed;z-index:11;left:50%;bottom:18px;transform:translateX(-50%) translateY(130%);width:min(720px,calc(100% - 24px));background:#11110ff2;border:1px solid #ffffff22;backdrop-filter:blur(22px);padding:24px;border-radius:22px;transition:.45s cubic-bezier(.2,.8,.2,1);box-shadow:0 25px 80px #000b}.panel.open{transform:translateX(-50%) translateY(0)}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold)}h1{font-size:clamp(30px,7vw,54px);line-height:.95;margin:10px 0 14px;letter-spacing:-.05em}.story{color:#bdb7aa;line-height:1.55;margin:0 0 18px}.answers{display:grid;gap:8px}.answer{appearance:none;border:1px solid #ffffff20;background:#ffffff08;color:var(--paper);padding:14px 16px;border-radius:12px;text-align:left;font:inherit;cursor:pointer;transition:.2s}.answer:hover{border-color:#c7a55b77;transform:translateX(4px)}.answer.correct{border-color:#c7a55b;background:#c7a55b16}.answer.wrong{opacity:.5}.result{margin-top:14px;color:#c7a55b;min-height:22px}.close{position:absolute;right:16px;top:14px;border:0;background:none;color:#aaa;font-size:22px;cursor:pointer}.locate{position:fixed;z-index:10;right:18px;bottom:18px;border:1px solid #ffffff24;background:#11110fe8;color:var(--paper);padding:13px 16px;border-radius:14px;cursor:pointer;backdrop-filter:blur(12px)}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#151512;color:var(--paper)}.leaflet-popup-content{font-size:13px}.pin{width:28px;height:28px;border-radius:50%;background:#c7a55b;box-shadow:0 0 0 6px #c7a55b22,0 0 30px #c7a55b99;border:2px solid #fff}.locked{filter:grayscale(1);opacity:.5}.near{animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px #c7a55b10,0 0 45px #c7a55b}}@media(max-width:600px){.panel{padding:20px}.hud{top:10px;left:10px;right:10px}}
</style></head>
<body>
<div id="map"></div>
<div class="hud"><div class="brand"><b>BEBOKI</b><br><span style="color:#8d887d">GRA TERENOWA / KATOWICE</span></div><div class="xp">XP <strong id="xp">0</strong></div></div>
<button class="locate" id="locate">◉ MOJA POZYCJA</button>
<section class="panel" id="panel"><button class="close" id="close">×</button><div class="eyebrow" id="agent">SKARBNIK / QUEST</div><h1 id="title">Quest</h1><p class="story" id="story"></p><div class="answers" id="answers"></div><div class="result" id="result"></div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const state={xp:Number(localStorage.getItem('beboki_xp')||0),done:JSON.parse(localStorage.getItem('beboki_done')||'[]')};document.querySelector('#xp').textContent=state.xp;
const map=L.map('map',{zoomControl:false}).setView([50.2597,19.050],13);L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
let userMarker=null,locations=[];
const pin=L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[28,28],iconAnchor:[14,14]});
fetch('locations.json').then(r=>r.json()).then(data=>{locations=data.locations;locations.forEach(loc=>{const marker=L.marker([loc.lat,loc.lng],{icon:pin}).addTo(map);marker.bindTooltip(loc.name,{direction:'top',offset:[0,-12]});marker.on('click',()=>openQuest(loc));});});
function openQuest(loc){document.querySelector('#agent').textContent=(loc.agent||'BEBOK').toUpperCase()+' / QUEST '+loc.chapter;document.querySelector('#title').textContent=loc.title;document.querySelector('#story').textContent=loc.story;const box=document.querySelector('#answers');box.innerHTML='';document.querySelector('#result').textContent=state.done.includes(loc.id)?'✓ QUEST JUŻ ODKRYTY — SCENA ODBLOKOWANA':'';loc.answers.forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>{if(state.done.includes(loc.id))return;if(i===loc.correct){state.done.push(loc.id);state.xp+=loc.rewardXp;localStorage.setItem('beboki_xp',state.xp);localStorage.setItem('beboki_done',JSON.stringify(state.done));document.querySelector('#xp').textContent=state.xp;b.classList.add('correct');document.querySelector('#result').textContent='SCENA ODBLOKOWANA  •  +'+loc.rewardXp+' XP  •  '+loc.scene}else{b.classList.add('wrong');document.querySelector('#result').textContent='Nie tym razem. Poszukaj innego tropu.'}};box.appendChild(b)});document.querySelector('#panel').classList.add('open')}
document.querySelector('#close').onclick=()=>document.querySelector('#panel').classList.remove('open');
document.querySelector('#locate').onclick=()=>{if(!navigator.geolocation){alert('Ta przeglądarka nie udostępnia GPS.');return}navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(userMarker)userMarker.setLatLng(ll);else userMarker=L.circleMarker(ll,{radius:8,color:'#c7a55b',fillOpacity:.9}).addTo(map);map.setView(ll,16);locations.forEach(l=>{const d=map.distance(ll,[l.lat,l.lng]);if(d<=l.radiusMeters){openQuest(l)}})},()=>alert('Włącz lokalizację, aby uruchomić questy w terenie.'),{enableHighAccuracy:true})};
</script></body></html>
