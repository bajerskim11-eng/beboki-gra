<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Wioska 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#10130f;color:#f5ead2;font-family:system-ui}#game{position:fixed;inset:0}canvas{display:block;touch-action:none}.ui{position:fixed;z-index:20;left:0;right:0;pointer-events:none}.top{top:0;padding:12px;display:flex;gap:8px}.chip{background:#17140fee;border:1px solid #8b6a3b;border-radius:12px;padding:8px 10px;font-size:11px;box-shadow:0 4px 18px #0008}.chip b{font-size:14px}.grow{flex:1}.bottom{bottom:12px;padding:0 12px;display:flex;gap:8px;pointer-events:auto}.btn{flex:1;padding:13px 8px;border:1px solid #8b6a3b;border-radius:12px;background:#211a13ee;color:#f5ead2;font-weight:900}.btn.active{background:#657d42}.status{top:62px;margin:0 12px;background:#17140fee;border:1px solid #66502e;border-radius:12px;padding:10px;font-size:12px}.panel{left:12px;right:12px;bottom:72px;background:#17140ff7;border:1px solid #8b6a3b;border-radius:18px;padding:15px;display:none;box-shadow:0 8px 30px #0009}.panel.show{display:block}.panel h2{margin:0 0 5px}.panel p{margin:0;color:#d8c9aa;font-size:13px}.loading{position:fixed;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0d0bf9}.loading.hide{display:none}.spinner{width:42px;height:42px;border:3px solid #604b2c;border-top-color:#e8bd6a;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.hint{position:fixed;z-index:15;bottom:70px;left:50%;transform:translateX(-50%);background:#111b14dd;border:1px solid #806338;border-radius:999px;padding:8px 12px;font-size:11px;white-space:nowrap}.hint.hide{display:none}</style></head><body><div id="game"></div><div id="loading"><div class="spinner"></div></div><div class="ui top"><div class="chip">🪙 <b>500</b></div><div class="chip">🐕 <b>0</b></div><div class="grow"></div><div class="chip">BEBOKI • WIOSKA</div></div><div id="status" class="ui status">Przygotowuję wioskę…</div><div id="panel" class="ui panel"><h2 id="name">Bebok</h2><p id="desc"></p></div><div id="hint" class="hint">Przeciągnij • zoom • kliknij Beboka</div><div class="ui bottom"><button class="btn active" id="villageBtn">🏘️ WIOSKA</button><button class="btn" id="centerBtn">🎥 CENTRUJ</button><button class="btn" id="missionBtn">🐕 MISJA</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const $=s=>document.querySelector(s),status=$('#status'),loading=$('#loading'),panel=$('#panel');const V='https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-village-source.jpg?v=1787899947';const roles={Hanys:['GÓRNIK','Kopanie zawałów i wydobycie.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpg?v=1787894020'],Hopla:['ZWIADOWCZYNI','Wykrywanie sekretów i dróg.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game.jpg?v=1787894032'],Fachura:['WYNALAZCA','Mechanizmy i naprawy.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game.jpg?v=1787894045'],Podciep:['LATARNIK','Światło i odkrywanie miejsc.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game.jpg?v=1787894060']};const scene=new THREE.Scene();scene.background=new THREE.Color(0x10130f);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,3.4,8);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('#game').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=13;controls.maxPolarAngle=Math.PI*.48;controls.minPolarAngle=.35;controls.target.set(0,1.7,0);scene.add(new THREE.HemisphereLight(0xffdfb0,0x263a35,2.5));const key=new THREE.DirectionalLight(0xffd59a,3);key.position.set(-5,8,6);scene.add(key);const root=new THREE.Group();scene.add(root);const texLoader=new THREE.TextureLoader();function makeWorld(){const tex=texLoader.load(V,()=>{status.textContent='Wioska gotowa • dotknij Beboka';loading.classList.add('hide');setTimeout(()=>$('#hint').classList.add('hide'),7000)},undefined,()=>{status.textContent='Nie udało się pobrać grafiki wioski'});tex.colorSpace=THREE.SRGBColorSpace;const bg=new THREE.Mesh(new THREE.PlaneGeometry(14,7.875),new THREE.MeshBasicMaterial({map:tex,depthWrite:false}));bg.position.set(0,3.5,-4);root.add(bg);const ground=new THREE.Mesh(new THREE.CircleGeometry(6.4,64),new THREE.MeshStandardMaterial({color:0x394332,roughness:1}));ground.rotation.x=-Math.PI/2;ground.scale.set(1.35,.75,1);ground.position.y=-.03;root.add(ground);const path=new THREE.Mesh(new THREE.PlaneGeometry(8,.9),new THREE.MeshStandardMaterial({color:0x7b674b,roughness:1}));path.rotation.x=-Math.PI/2;path.rotation.z=.05;path.position.set(0,.01,.4);root.add(path);for(const x of[-3.8,3.8]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,2.1,8),new THREE.MeshStandardMaterial({color:0x30271d,metalness:.4,roughness:.8}));post.position.set(x,1,.1);root.add(post);const lamp=new THREE.PointLight(0xffb64b,7,4);lamp.position.set(x,2.1,.1);root.add(lamp)}}makeWorld();const chars=new THREE.Group();root.add(chars);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function addBebok(name,x,z){const tex=texLoader.load(roles[name][2]);tex.colorSpace=THREE.SRGBColorSpace;const mat=new THREE.SpriteMaterial({map:tex,transparent:true,alphaTest:.35,depthWrite:false});const s=new THREE.Sprite(mat);s.scale.set(.95,1.65,1);s.position.set(x,1.0,z);s.userData={name,phase:Math.random()*6,baseY:1};chars.add(s);const shadow=new THREE.Mesh(new THREE.CircleGeometry(.23,24),new THREE.MeshBasicMaterial({color:0x11110d,transparent:true,opacity:.45}));shadow.rotation.x=-Math.PI/2;shadow.position.set(x,.025,z);shadow.scale.set(1.7,.7,1);chars.add(shadow)}addBebok('Hanys',-2.4,.7);addBebok('Hopla',-.8,1.15);addBebok('Fachura',1,.7);addBebok('Podciep',2.55,1);renderer.domElement.addEventListener('pointerup',e=>{const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(chars.children).find(h=>h.object.userData.name);if(!hit)return;const n=hit.object.userData.name;$('#name').textContent=n;$('#desc').textContent=roles[n][0]+' — '+roles[n][1];panel.classList.add('show');controls.target.set(hit.object.position.x,1,hit.object.position.z)});$('#centerBtn').onclick=()=>{camera.position.set(0,3.4,8);controls.target.set(0,1.7,0)};$('#missionBtn').onclick=()=>{$('#name').textContent='PIERWSZA MISJA';$('#desc').textContent='Pies wyczuł coś pod starą kamienicą. Wkrótce ruszamy do piwnic.';panel.classList.add('show')};let t=0;function animate(){requestAnimationFrame(animate);t+=.016;chars.children.forEach(o=>{if(o.userData.name)o.position.y=o.userData.baseY+Math.sin(t*1.8+o.userData.phase)*.025});controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
