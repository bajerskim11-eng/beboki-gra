<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Wioska 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0a0d0b;color:#f5ead2;font-family:system-ui}#game{position:fixed;inset:0}canvas{touch-action:none;display:block}.ui{position:fixed;z-index:20;left:0;right:0;pointer-events:none}.top{top:0;padding:12px;display:flex;gap:8px}.chip{background:#17140fee;border:1px solid #8b6a3b;border-radius:12px;padding:8px 10px;font-size:11px;box-shadow:0 4px 18px #0008}.chip b{font-size:14px}.grow{flex:1}.bottom{bottom:12px;padding:0 12px;display:flex;gap:8px;pointer-events:auto}.btn{flex:1;padding:13px 8px;border:1px solid #8b6a3b;border-radius:12px;background:#211a13ee;color:#f5ead2;font-weight:900}.btn.active{background:#657d42}.status{top:62px;margin:0 12px;background:#17140fee;border:1px solid #66502e;border-radius:12px;padding:10px;font-size:12px}.panel{left:12px;right:12px;bottom:72px;background:#17140ff5;border:1px solid #8b6a3b;border-radius:18px;padding:15px;display:none;box-shadow:0 8px 30px #0009}.panel.show{display:block}.panel h2{margin:0 0 5px}.panel p{margin:0;color:#d8c9aa;font-size:13px}.loading{position:fixed;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0d0bf9}.loading.hide{display:none}.spinner{width:42px;height:42px;border:3px solid #604b2c;border-top-color:#e8bd6a;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.hint{position:fixed;z-index:15;bottom:70px;left:50%;transform:translateX(-50%);background:#111b14dd;border:1px solid #806338;border-radius:999px;padding:8px 12px;font-size:11px;white-space:nowrap}.hint.hide{display:none}</style></head><body><div id="game"></div><div id="loading"><div class="spinner"></div></div><div class="ui top"><div class="chip">🪙 <b>500</b></div><div class="chip">🐕 <b>0</b></div><div class="grow"></div><div class="chip">BEBOKI • WIOSKA</div></div><div id="status" class="ui status">Buduję scenę wioski…</div><div id="panel" class="ui panel"><h2 id="name">Bebok</h2><p id="desc"></p></div><div id="hint" class="hint">Przeciągnij, aby rozejrzeć się • kółko / szczypanie = zoom • kliknij Beboka</div><div class="ui bottom"><button class="btn active" id="villageBtn">🏘️ WIOSKA</button><button class="btn" id="centerBtn">🎥 CENTRUJ</button><button class="btn" id="missionBtn">🐕 MISJA</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{SparkRenderer,SplatMesh}from'@sparkjsdev/spark';const $=s=>document.querySelector(s),status=$('#status'),loading=$('#loading'),panel=$('#panel');const V='https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-village-source.jpg?v=1787899947';const roles={Hanys:['GÓRNIK','Kopanie zawałów i wydobycie.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpg?v=1787894020'],Hopla:['ZWIADOWCZYNI','Wykrywanie sekretów i dróg.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game.jpg?v=1787894032'],Fachura:['WYNALAZCA','Mechanizmy i naprawy.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game.jpg?v=1787894045'],Podciep:['LATARNIK','Światło i odkrywanie miejsc.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game.jpg?v=1787894060']};const scene=new THREE.Scene();scene.background=new THREE.Color(0x090d0b);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.01,1000);camera.position.set(0,2.8,7.5);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('#game').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=12;controls.maxPolarAngle=Math.PI*.48;controls.minPolarAngle=.25;controls.target.set(0,1.8,0);const hemi=new THREE.HemisphereLight(0xffe0ad,0x1b2b35,2.2);scene.add(hemi);const key=new THREE.DirectionalLight(0xffd59a,3);key.position.set(-4,7,5);scene.add(key);const fill=new THREE.PointLight(0xffa52f,10,8);fill.position.set(0,2,2);scene.add(fill);const root=new THREE.Group();scene.add(root);function makeBackdrop(){const tex=new THREE.TextureLoader().load(V,()=>{$('#status').textContent='Wioska załadowana • scena 3D gotowa';loading.classList.add('hide');setTimeout(()=>$('#hint').classList.add('hide'),6500)});tex.colorSpace=THREE.SRGBColorSpace;const mat=new THREE.MeshBasicMaterial({map:tex});const geo=new THREE.PlaneGeometry(12,12*9/16);const bg=new THREE.Mesh(geo,mat);bg.position.set(0,3.4,-4);bg.scale.set(1.22,1.22,1);root.add(bg);const ground=new THREE.Mesh(new THREE.PlaneGeometry(12,7),new THREE.MeshStandardMaterial({color:0x211b15,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,0,0);root.add(ground);for(let i=0;i<7;i++){const box=new THREE.Mesh(new THREE.BoxGeometry(.8+Math.random()*.7,.35,.5+Math.random()*.4),new THREE.MeshStandardMaterial({color:0x34291f,roughness:1}));box.position.set(-4+i*1.35,.18,-.8+Math.random()*1.4);root.add(box)}for(const x of[-3.8,3.8]){const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,2.2,8),new THREE.MeshStandardMaterial({color:0x30271d,metalness:.5,roughness:.7}));lamp.position.set(x,1.1,.2);root.add(lamp);const glow=new THREE.PointLight(0xffb64b,8,4);glow.position.set(x,2.1,.2);root.add(glow)}}makeBackdrop();const chars=new THREE.Group();root.add(chars);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function addBebok(name,x,z){const tex=new THREE.TextureLoader().load(roles[name][2]);tex.colorSpace=THREE.SRGBColorSpace;const mat=new THREE.SpriteMaterial({map:tex,transparent:true,alphaTest:.08,depthWrite:false});const s=new THREE.Sprite(mat);s.scale.set(1.25,2.15,1);s.position.set(x,1.12,z);s.userData={name,baseY:1.12,phase:Math.random()*6};chars.add(s)}addBebok('Hanys',-2.5,.7);addBebok('Hopla',-.7,1.15);addBebok('Fachura',1.2,.65);addBebok('Podciep',2.8,.95);renderer.domElement.addEventListener('pointerup',e=>{const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(chars.children)[0];if(!hit)return;const n=hit.object.userData.name;$('#name').textContent=n;$('#desc').textContent=roles[n][0]+' — '+roles[n][1];panel.classList.add('show');controls.target.lerp(new THREE.Vector3(hit.object.position.x,1,hit.object.position.z),.5)});$('#centerBtn').onclick=()=>{camera.position.set(0,2.8,7.5);controls.target.set(0,1.8,0)};$('#missionBtn').onclick=()=>{$('#name').textContent='PIERWSZA MISJA';$('#desc').textContent='Pies wyczuł coś pod starą kamienicą. Wybierz Beboka, a następnie ruszymy do piwnic.';panel.classList.add('show')};let t=0;function animate(){requestAnimationFrame(animate);t+=.016;chars.children.forEach(s=>{s.position.y=s.userData.baseY+Math.sin(t*1.8+s.userData.phase)*.035});controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
