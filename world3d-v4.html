<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Świat 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090b0a;color:#f5ead2;font-family:system-ui}#game{position:fixed;inset:0}.top,.bottom,.status,.panel{position:fixed;z-index:10}.top{top:0;left:0;right:0;padding:12px;display:flex;gap:7px;pointer-events:none}.chip{background:#17140fee;border:1px solid #8b6a3b;border-radius:12px;padding:8px 10px;font-size:11px}.chip b{font-size:14px}.grow{flex:1}.bottom{left:12px;right:12px;bottom:12px;display:flex;gap:7px}.btn{flex:1;padding:13px 8px;border:1px solid #8b6a3b;border-radius:12px;background:#211a13ee;color:#f5ead2;font-weight:900}.btn.active{background:#5e753c}.status{top:62px;left:12px;right:12px;background:#17140fee;border:1px solid #66502e;border-radius:12px;padding:10px;font-size:12px}.panel{left:12px;right:12px;bottom:75px;background:#17140ff5;border:1px solid #8b6a3b;border-radius:18px;padding:15px;display:none}.panel.show{display:block}.panel h2{margin:0 0 5px}.panel p{margin:0;color:#d8c9aa;font-size:13px}.fallback{position:fixed;inset:0;z-index:2;background:#10120f}.fallback img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.05)}.fallback .msg{position:absolute;left:18px;right:18px;bottom:105px;background:#17140fed;border:1px solid #8b6a3b;border-radius:16px;padding:15px;text-align:center}.fallback.hidden{display:none}.loading{position:fixed;z-index:11;inset:0;display:flex;align-items:center;justify-content:center;background:#090b0a}.loading.hide{display:none}.spinner{width:42px;height:42px;border:3px solid #604b2c;border-top-color:#e8bd6a;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}canvas{touch-action:none}</style></head><body><div id="game"></div><div id="fallback" class="fallback"><img id="village" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-village-source.jpg?v=1787899947"><div class="msg"><b>WIOSKA BEBOKÓW</b><br><span id="fallbackText">Świat 3D jest przygotowywany. Referencja wioski jest już załadowana.</span></div></div><div id="loading" class="loading"><div class="spinner"></div></div><div class="top"><div class="chip">🪙 <b>500</b></div><div class="chip">🐕 <b>0</b></div><div class="grow"></div><div class="chip">BEBOKI • WORLD 3D</div></div><div id="status" class="status">Uruchamianie silnika 3D…</div><div id="panel" class="panel"><h2 id="name">Bebok</h2><p id="desc">Wybierz postać.</p></div><div class="bottom"><button class="btn active" id="worldBtn">🌍 ŚWIAT</button><button class="btn" id="resetBtn">🎥 KAMERA</button><button class="btn" id="missionBtn">🐕 MISJA</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{SparkRenderer,SplatMesh}from'@sparkjsdev/spark';const status=document.querySelector('#status'),fallback=document.querySelector('#fallback'),loading=document.querySelector('#loading');const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d120f);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,1000);camera.position.set(7,5,10);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);document.querySelector('#game').appendChild(renderer.domElement);let controls;try{controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0)}catch(e){console.error(e)}let spark;try{spark=new SparkRenderer({renderer});scene.add(spark);status.textContent='Silnik 3D uruchomiony. Szukam świata SPZ…'}catch(e){console.error(e);status.textContent='Tryb bez Gaussian Splat — scena referencyjna.'}const WORLD='/worlds/beboki-village/0-world-500k.spz';let loaded=false;function tryWorld(){if(!spark)return;const splat=new SplatMesh({url:WORLD,lod:true,onLoad:()=>{loaded=true;fallback.classList.add('hidden');loading.classList.add('hide');status.textContent='Świat 3D załadowany • obracaj i przybliżaj';},onProgress:e=>{if(e&&e.total)status.textContent='Świat 3D: '+Math.round(e.loaded/e.total*100)+'%'}});splat.addEventListener('error',()=>{status.textContent='Brak pliku SPZ — działamy na referencji wioski.';loading.classList.add('hide')});scene.add(splat);setTimeout(()=>{if(!loaded){loading.classList.add('hide');status.textContent='Referencja wioski działa. SPZ pojawi się po wygenerowaniu świata.'}},6000)}try{tryWorld()}catch(e){console.error(e);loading.classList.add('hide');status.textContent='Tryb referencyjny.'}const roles={Hanys:['GÓRNIK','Kopanie zawałów i wydobycie.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpg?v=1787894020'],Hopla:['ZWIADOWCZYNI','Wykrywanie sekretów i dróg.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game.jpg?v=1787894032'],Fachura:['WYNALAZCA','Mechanizmy i naprawy.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game.jpg?v=1787894045'],Podciep:['LATARNIK','Światło i odkrywanie miejsc.','https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game.jpg?v=1787894060']};const chars=new THREE.Group();scene.add(chars);function addBebok(name,x,z){const tex=new THREE.TextureLoader().load(roles[name][2]);const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false});const s=new THREE.Sprite(mat);s.scale.set(1.5,2.3,1);s.position.set(x,1.15,z);s.userData={name};chars.add(s)}addBebok('Hanys',-2,1);addBebok('Hopla',0,2);addBebok('Fachura',2,1);addBebok('Podciep',1,-1.5);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(chars.children)[0];if(!hit)return;const n=hit.object.userData.name;document.querySelector('#name').textContent=n;document.querySelector('#desc').textContent=roles[n][0]+': '+roles[n][1];document.querySelector('#panel').classList.add('show')});document.querySelector('#resetBtn').onclick=()=>{camera.position.set(7,5,10);if(controls)controls.target.set(0,1,0)};document.querySelector('#missionBtn').onclick=()=>{document.querySelector('#panel').classList.add('show');document.querySelector('#name').textContent='PIERWSZA MISJA';document.querySelector('#desc').textContent='Pies wyczuł coś pod piwnicami. Wybierz Beboka i wyrusz na zwiad.'};function loop(){requestAnimationFrame(loop);if(controls)controls.update();renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.addEventListener('error',e=>{console.error(e.error||e.message);loading.classList.add('hide');status.textContent='Silnik działa w trybie awaryjnym — referencja wioski pozostaje dostępna.'});</script></body></html>
