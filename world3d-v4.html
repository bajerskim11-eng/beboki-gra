<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Świat 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0e0d;color:#f5ead2;font-family:system-ui}#game{position:fixed;inset:0}.top{position:fixed;z-index:5;top:0;left:0;right:0;padding:12px;display:flex;gap:7px;pointer-events:none}.chip{background:#17140fe8;border:1px solid #8b6a3b;border-radius:12px;padding:8px 10px;font-size:11px}.chip b{font-size:14px}.grow{flex:1}.bottom{position:fixed;z-index:5;left:12px;right:12px;bottom:12px;display:flex;gap:7px}.btn{flex:1;padding:13px 8px;border:1px solid #8b6a3b;border-radius:12px;background:#211a13eF;color:#f5ead2;font-weight:900}.btn.active{background:#5e753c}.panel{position:fixed;z-index:8;left:12px;right:12px;bottom:75px;background:#17140ff5;border:1px solid #8b6a3b;border-radius:18px;padding:15px;display:none}.panel.show{display:block}.panel h2{margin:0 0 5px}.panel p{margin:0;color:#d8c9aa;font-size:13px}.status{position:fixed;z-index:7;top:62px;left:12px;right:12px;background:#17140fd9;border:1px solid #66502e;border-radius:12px;padding:10px;font-size:12px}.source{position:fixed;inset:0;background:#10120f;display:flex;align-items:center;justify-content:center;z-index:6}.source img{width:100%;height:100%;object-fit:cover;opacity:.8}.source .msg{position:absolute;left:18px;right:18px;bottom:105px;background:#17140fee;border:1px solid #8b6a3b;border-radius:16px;padding:15px;text-align:center}.source.hidden{display:none}.dot{position:fixed;z-index:7;width:14px;height:14px;border-radius:50%;background:#f2b85b;box-shadow:0 0 20px #f2b85b;display:none}</style></head><body><div id="game"></div><div class="top"><div class="chip">🪙 <b>500</b></div><div class="chip">🐕 <b id="dogs">0</b></div><div class="grow"></div><div class="chip">BEBOKI • WORLD 3D</div></div><div id="status" class="status">Ładowanie świata 3D…</div><div id="source" class="source"><img src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-village-source.jpg?v=1787899947"><div class="msg"><b>WIOSKA BEBOKÓW</b><br><span>To jest dokładnie Twoja referencja środowiska. Gdy wygenerujemy SPZ/PLY z Image2World, ta plansza zostanie zastąpiona prawdziwą sceną 3D.</span></div></div><div id="panel" class="panel"><h2 id="name">Bebok</h2><p id="desc">Wybierz postać.</p></div><div class="bottom"><button class="btn active" id="worldBtn">🌍 ŚWIAT</button><button class="btn" id="resetBtn">🎥 KAMERA</button><button class="btn" id="missionBtn">🐕 MISJA</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{NewSparkRenderer,SplatMesh}from'@sparkjsdev/spark';const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d120f);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,1000);camera.position.set(7,5,10);const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.querySelector('#game').appendChild(renderer.domElement);const spark=new NewSparkRenderer({renderer});scene.add(spark);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);let worldLoaded=false;const WORLD='/worlds/beboki-village/0-world-500k.spz';const status=document.querySelector('#status');try{const splat=new SplatMesh({url:WORLD,lod:true,onLoad:()=>{worldLoaded=true;document.querySelector('#source').classList.add('hidden');status.textContent='Świat 3D załadowany • możesz obracać i przybliżać scenę.'},onProgress:e=>{if(e&&e.total)status.textContent='Świat 3D: '+Math.round(e.loaded/e.total*100)+'%'}});scene.add(splat)}catch(e){status.textContent='Tryb referencyjny — brak wygenerowanego SPZ.'}const roles={Hanys:['GÓRNIK','Kopanie zawałów i wydobycie.'],Hopla:['ZWIADOWCZYNI','Wykrywanie sekretów i dróg.'],Fachura:['WYNALAZCA','Mechanizmy i naprawy.'],Podciep:['LATARNIK','Światło i odkrywanie miejsc.']};const charGroup=new THREE.Group();scene.add(charGroup);const makeCard=(name,x,z)=>{const tex=new THREE.TextureLoader().load(name==='Hanys'?'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpg?v=1787894020':name==='Hopla'?'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game.jpg?v=1787894032':name==='Fachura'?'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game.jpg?v=1787894045':'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game.jpg?v=1787894060');const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false});const s=new THREE.Sprite(mat);s.scale.set(1.7,2.5,1);s.position.set(x,1.25,z);s.userData={name};charGroup.add(s)};makeCard('Hanys',-2,1);makeCard('Hopla',0,2);makeCard('Fachura',2,1);makeCard('Podciep',1,-1.5);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(charGroup.children)[0];if(!hit)return;const n=hit.object.userData.name;document.querySelector('#name').textContent=n;document.querySelector('#desc').textContent=roles[n][0]+': '+roles[n][1];document.querySelector('#panel').classList.add('show')});document.querySelector('#resetBtn').onclick=()=>{camera.position.set(7,5,10);controls.target.set(0,1,0)};document.querySelector('#missionBtn').onclick=()=>{document.querySelector('#panel').classList.add('show');document.querySelector('#name').textContent='PIERWSZA MISJA';document.querySelector('#desc').textContent='Pies wyczuł coś pod piwnicami. Wybierz Beboka i wyrusz na zwiad.'};function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
