<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Osada Beboków 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071018;font-family:system-ui;color:#f6e6c6}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:5;left:14px;top:14px;right:14px;display:flex;gap:8px;pointer-events:none}.panel{background:rgba(18,15,12,.86);border:1px solid #806233;border-radius:12px;padding:9px 12px;backdrop-filter:blur(5px);box-shadow:0 5px 20px #0008}.title{font-weight:900;font-size:18px}.sub{font-size:11px;color:#d8c6a5}.spacer{flex:1}.help{position:fixed;z-index:5;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap}.selected{position:fixed;z-index:6;left:50%;bottom:66px;transform:translateX(-50%);display:none}.selected.show{display:block}.touch{position:fixed;z-index:7;right:14px;bottom:14px;display:flex;gap:7px}.touch button{border:1px solid #806233;background:#201a14dd;color:#f6e6c6;border-radius:12px;padding:12px;font-weight:900}.fade{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,transparent 45%,#02070dcc)}@media(max-width:600px){.title{font-size:15px}.help{font-size:10px}.hud{left:8px;top:8px;right:8px}.panel{padding:7px 9px}.sub{font-size:9px}}</style></head><body><div id="game"></div><div class="fade"></div><div class="hud"><div class="panel"><div class="title">OSADA BEBOKÓW</div><div class="sub">Katowice • wieczór</div></div><div class="spacer"></div><div class="panel">🪙 1250 &nbsp; ⛏️ 340 &nbsp; 🐕 5</div></div><div id="selected" class="panel selected"></div><div class="panel help">Przeciągnij — obracaj kamerę • rolka/szczypanie — zoom • kliknij Beboka</div><div class="touch"><button onclick="resetView()">↺</button><button onclick="focusVillage()">⌂</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x08121a);scene.fog=new THREE.FogExp2(0x08121a,.018);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);camera.position.set(0,34,48);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.querySelector('#game').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,5,0);controls.enableDamping=true;controls.minDistance=16;controls.maxDistance=85;controls.maxPolarAngle=Math.PI*.46;const hemi=new THREE.HemisphereLight(0x9db4c5,0x2c2116,1.7);scene.add(hemi);const moon=new THREE.DirectionalLight(0x9bb7d0,1.8);moon.position.set(-30,50,20);scene.add(moon);const warm=new THREE.PointLight(0xffa13a,35,28);warm.position.set(0,12,2);scene.add(warm);function box(w,h,d,x,y,z,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:.05}));m.position.set(x,y,z);scene.add(m);return m}function building(x,z,w,h,d,c){const b=box(w,h,d,x,h/2,z,c);box(w*.72,.18,d*.72,x,h+.12,z,0x20252a);return b}const ground=box(110,.5,100,0,-.25,0,0x34372e);for(let i=-45;i<46;i+=4)for(let j=-42;j<43;j+=4)box(3.5,.06,3.5,i,.04,j,((i+j)%8===0)?0x4d4a42:0x414039);building(-26,-8,19,15,15,0x6a4330);building(-6,-13,13,11,12,0x694634);building(15,-10,18,14,14,0x59402f);building(31,6,12,23,12,0x4b3b31);building(-29,15,14,12,13,0x624332);building(7,15,17,10,14,0x704b34);box(4,1,20,0,.6,0,0x171717);for(let i=0;i<6;i++)box(2,.7,7,-22+i*9,.7,4,0x302a24);const lanterns=[];function lantern(x,y,z){box(.5,2,.5,x,y,z,0x211d18);const l=new THREE.PointLight(0xffad45,20,12);l.position.set(x,y+1,z);scene.add(l);const orb=new THREE.Mesh(new THREE.SphereGeometry(.42,12,12),new THREE.MeshBasicMaterial({color:0xffc05b}));orb.position.set(x,y+1,z);scene.add(orb);lanterns.push(l)}lantern(-20,3,1);lantern(-3,3,4);lantern(14,3,2);lantern(29,5,5);lantern(-28,3,14);function addBebok(name,x,z,color){const g=new THREE.Group();g.userData.name=name;const mat=new THREE.MeshStandardMaterial({color,roughness:.65});const body=new THREE.Mesh(new THREE.CapsuleGeometry(1.15,2.1,5,10),mat);body.position.y=2.4;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(1.35,16,12),mat);head.position.y=4.5;g.add(head);const ear=new THREE.ConeGeometry(.55,1.35,4);for(const s of[-1,1]){const e=new THREE.Mesh(ear,mat);e.rotation.z=s*.9;e.position.set(s*1.25,4.6,0);g.add(e)}const hat=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.25,.35,16),new THREE.MeshStandardMaterial({color:0x40352b,roughness:.8}));hat.position.y=5.45;g.add(hat);g.position.set(x,0,z);g.scale.setScalar(1.05);scene.add(g);return g}const units=[addBebok('Hanys',-11,7,0x5b743e),addBebok('Hopla',-1,10,0xd78fa8),addBebok('Fachura',9,7,0x4c7fa3),addBebok('Podciep',20,9,0x66507d)];function dog(x,z){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x8b684a});const b=new THREE.Mesh(new THREE.CapsuleGeometry(.8,1.3,4,8),mat);b.position.y=1.1;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.85,12,10),mat);h.position.set(.8,2,0);g.add(h);g.position.set(x,0,z);scene.add(g)}dog(27,8);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(units,true);if(hits.length){let o=hits[0].object;while(o.parent&&!o.userData.name)o=o.parent;const n=o.userData.name;document.querySelector('#selected').textContent=n+' • kliknij ponownie, aby wejść w interakcję';document.querySelector('#selected').classList.add('show');units.forEach(u=>u.scale.setScalar(1.05));o.scale.setScalar(1.22)}});function resetView(){camera.position.set(0,34,48);controls.target.set(0,5,0)}function focusVillage(){camera.position.set(0,27,38);controls.target.set(0,3,4)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();lanterns.forEach((l,i)=>l.intensity=17+Math.sin(performance.now()*.003+i)*4);renderer.render(scene,camera)}animate();</script></body></html>
