<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Osada 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070b10;font-family:system-ui;color:#f4e5c6}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;z-index:5;left:12px;right:12px;top:12px;display:flex;gap:8px;pointer-events:none}.panel{background:rgba(16,13,11,.88);border:1px solid #8a6b39;border-radius:12px;padding:9px 12px;box-shadow:0 5px 20px #0008;backdrop-filter:blur(5px)}.title{font-size:18px;font-weight:900}.sub{font-size:11px;color:#d8c5a2}.spacer{flex:1}.hint{position:fixed;z-index:5;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap}.sel{position:fixed;z-index:6;left:50%;bottom:62px;transform:translateX(-50%);display:none}.sel.show{display:block}.actions{display:flex;gap:7px;position:fixed;z-index:7;right:12px;bottom:12px}.actions button{border:1px solid #8a6b39;background:#211a13e8;color:#f4e5c6;border-radius:11px;padding:11px;font-weight:900}.tip{font-size:11px}@media(max-width:600px){.title{font-size:14px}.panel{padding:7px 9px}.tip{font-size:9px}.hint{font-size:9px;bottom:10px}.hud{top:7px;left:7px;right:7px}}
</style></head><body><div id="game"></div><div class="hud"><div class="panel"><div class="title">OSADA BEBOKÓW</div><div class="sub">Katowice • centrum osady</div></div><div class="spacer"></div><div class="panel">🪙 1250 &nbsp; ⛏️ 340 &nbsp; 🐕 5</div></div><div id="sel" class="panel sel"></div><div class="panel hint"><span class="tip">Przeciągnij, aby obracać • scroll/szczypanie = zoom • kliknij Beboka</span></div><div class="actions"><button onclick="home()">⌂</button><button onclick="resetCam()">↺</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const ENV='https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-village-environment.jpg?v=1787899136';
const SPRITES={Hanys:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-sprite_90fd0d25-945c-4828-899b-37d6ceaaa0ee.png?v=1787899157',Hopla:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-sprite_e955db48-de4f-498d-888a-6d629975a320.png?v=1787899173',Fachura:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-sprite_105de105-46ee-4354-b890-72128ac211d0.png?v=1787899189',Podciep:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-sprite_492f1978-d7e8-439c-866f-fefbd1d865b5.png?v=1787899204'};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071018);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);camera.position.set(0,18,31);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.querySelector('#game').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,5,0);controls.enableDamping=true;controls.minDistance=9;controls.maxDistance=70;controls.maxPolarAngle=Math.PI*.49;scene.add(new THREE.HemisphereLight(0x9eb4c5,0x20170f,1.55));const moon=new THREE.DirectionalLight(0xa5bfd2,1.5);moon.position.set(-25,40,20);scene.add(moon);const warm=new THREE.PointLight(0xffa13b,55,35);warm.position.set(-2,10,6);scene.add(warm);
// Supplied village artwork is the actual environment of this prototype, mapped into the 3D scene as its backdrop.
const tex=new THREE.TextureLoader().load(ENV);tex.colorSpace=THREE.SRGBColorSpace;const bg=new THREE.Mesh(new THREE.PlaneGeometry(100,62),new THREE.MeshBasicMaterial({map:tex,depthWrite:false}));bg.position.set(0,28,-30);bg.scale.set(1.42,1.42,1);scene.add(bg);
// A 3D interaction surface in front of the environment.
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,65),new THREE.MeshStandardMaterial({color:0x26221d,roughness:.95,metalness:.02}));floor.rotation.x=-Math.PI/2;floor.position.y=-.05;floor.position.z=4;scene.add(floor);
function sprite(name,x,z,scale){const map=new THREE.TextureLoader().load(SPRITES[name]);map.colorSpace=THREE.SRGBColorSpace;const mat=new THREE.SpriteMaterial({map,transparent:true,depthWrite:false});const sp=new THREE.Sprite(mat);sp.name=name;sp.position.set(x,4,z);sp.scale.set(6*scale,9*scale,1);scene.add(sp);return sp}const units=[sprite('Hanys',-9,5,.72),sprite('Hopla',-1,7,.68),sprite('Fachura',8,5,.7),sprite('Podciep',18,7,.66)];
function lamp(x,z){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,4,8),new THREE.MeshStandardMaterial({color:0x302a24,roughness:.8}));pole.position.set(x,2,z);scene.add(pole);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8),new THREE.MeshBasicMaterial({color:0xffbb55}));bulb.position.set(x,4,z);scene.add(bulb);const l=new THREE.PointLight(0xffa03d,18,10);l.position.set(x,4,z);scene.add(l)}[-18,-6,7,20].forEach((x,i)=>lamp(x,2+i%2*4));
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(units);if(hits.length){const n=hits[0].object.name;document.querySelector('#sel').textContent=n+' • wybrany Bebok';document.querySelector('#sel').classList.add('show');units.forEach(u=>u.material.opacity=.55);hits[0].object.material.opacity=1;controls.target.copy(hits[0].object.position)}});function resetCam(){camera.position.set(0,18,31);controls.target.set(0,5,0)}function home(){camera.position.set(0,15,27);controls.target.set(0,4,2)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(t){requestAnimationFrame(animate);controls.update();units.forEach((u,i)=>u.position.y=4+Math.sin(t*.0018+i)*.07);renderer.render(scene,camera)}animate(0);</script></body></html>
