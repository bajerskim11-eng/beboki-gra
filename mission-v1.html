<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Piwnice</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#f4e6c8;font-family:system-ui;min-height:100%;overflow:hidden}#game{height:100dvh;position:relative;background:#16120e}.scene{position:absolute;inset:0;background-image:linear-gradient(180deg,#0005,#0000 35%,#0008),url('https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-piwnica-scene-v1.png?v=1787897769');background-size:cover;background-position:center}.top{position:absolute;top:0;left:0;right:0;padding:8px;display:flex;gap:6px;background:linear-gradient(#0b0907ee,#0b090700);z-index:3}.badge{padding:8px 10px;border:1px solid #9b7841;border-radius:10px;background:#1a1510dd;font-size:12px}.title{position:absolute;left:16px;top:66px;font-size:clamp(20px,5vw,34px);font-weight:900;text-shadow:0 3px 8px #000;z-index:2}.objective{position:absolute;right:12px;top:66px;width:min(210px,38vw);padding:12px;border:1px solid #8e6b39;border-radius:13px;background:#17120eeb;font-size:12px;z-index:3}.objective b{font-size:14px}.obj{margin-top:6px}.bottom{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(#1110,#111e 18%,#110eec);z-index:4}.selected{display:flex;align-items:center;gap:10px;margin-bottom:8px}.portrait{width:55px;height:65px;object-fit:contain;background:#211a13;border:1px solid #8c6937;border-radius:9px}.name{font-weight:900}.role{font-size:11px;color:#cdb889}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.skill{min-height:56px;border:1px solid #856434;border-radius:10px;background:#211a13dd;color:#f6e5bf;font-weight:900;font-size:11px}.skill.active{outline:2px solid #d0a94d;background:#493718}.hotspot{position:absolute;z-index:3;border:2px solid transparent;border-radius:50%;cursor:pointer}.hotspot:hover,.hotspot:active{border-color:#e1b94e;background:#e1b94e22}.hanys{left:27%;top:31%;width:18%;height:24%}.hopla{left:39%;top:50%;width:18%;height:23%}.fachura{left:65%;top:49%;width:16%;height:23%}.podciep{left:21%;top:68%;width:18%;height:21%}.dog{right:7%;bottom:21%;width:18%;height:22%}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border:1px solid #d0a94d;border-radius:14px;background:#17120eee;z-index:8;display:none;text-align:center;font-weight:800}.toast.show{display:block;animation:pop .2s ease}@keyframes pop{from{transform:translate(-50%,-50%) scale(.9);opacity:.4}to{transform:translate(-50%,-50%) scale(1);opacity:1}}@media(max-width:700px){.objective{top:112px;right:8px;width:48vw}.title{top:64px}.scene{background-position:center top}.skills{grid-template-columns:repeat(4,1fr)}.skill{font-size:10px}.badge{padding:6px 7px}}
</style></head><body><div id="game"><div class="scene"></div><div class="top"><div class="badge">🪙 1 250</div><div class="badge">⛏️ 340</div><div class="badge">🐕 <span id="dogs">5</span></div><div class="badge">⭐ LVL 4</div></div><div class="title">PIWNICE KAMIENICY</div><div class="objective"><b>CELE MISJI</b><div class="obj">☑ Usuń zawał</div><div class="obj">☑ Znajdź przejście</div><div class="obj">☐ Napraw mechanizm</div><div class="obj">☐ 🐕 Uratuj psa</div></div><button class="hotspot hanys" onclick="select('Hanys','KOP','bebok-hanys-game.jpg','Hanys może usunąć zawał.')"></button><button class="hotspot hopla" onclick="select('Hopla','UŻYJ LINY','bebok-hopla-game.jpg','Hopla potrafi dotrzeć do ukrytych przejść.')"></button><button class="hotspot fachura" onclick="select('Fachura','NAPRAW','bebok-fachura-game.jpg','Fachura uruchamia mechanizmy.')"></button><button class="hotspot podciep" onclick="select('Podciep','OŚWIETL','bebok-podciep-game.jpg','Podciep odsłania to, czego nie widać w ciemności.')"></button><button class="hotspot dog" onclick="rescue()"></button><div class="bottom"><div class="selected"><img id="portrait" class="portrait" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpg?v=1787894020"><div><div id="name" class="name">Hanys</div><div id="role" class="role">KOPACZ · wybierz punkt na planszy</div></div></div><div class="skills"><button id="a1" class="skill active" onclick="action('KOP')">⛏️<br>KOP</button><button id="a2" class="skill" onclick="action('UŻYJ LINY')">🪢<br>LINY</button><button id="a3" class="skill" onclick="action('NAPRAW')">🔧<br>NAPRAW</button><button id="a4" class="skill" onclick="action('OŚWIETL')">🏮<br>ŚWIATŁO</button></div></div><div id="toast" class="toast"></div></div><script>const base='https://cdn.shopify.com/s/files/1/1019/1903/1622/files/';let current='Hanys',count=0;function select(name,skill,file,msg){current=name;document.getElementById('name').textContent=name;document.getElementById('role').textContent=msg;document.getElementById('portrait').src=base+file+'?v=1787894020';toast(name+' — '+skill+'<br><small>Wybierz miejsce działania.</small>')}function action(skill){count++;toast('✨ '+current+': '+skill+'<br><small>Działanie wykonane.</small>');if(count>=3){setTimeout(()=>toast('🐕 Pies wyczuł Beboki!<br><small>Znajdź go na dole piwnicy.</small>'),700)}}function rescue(){toast('🐶 PIES URATOWANY!<br><small>+120 monet · +15 rudy</small>');document.getElementById('dogs').textContent='6'}function toast(t){const x=document.getElementById('toast');x.innerHTML=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}</script></body></html>
