<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Pierwsza Wyprawa</title><style>html,body{margin:0;height:100%;background:#17130e;color:#f3e6ca;font-family:system-ui,sans-serif;overflow:hidden}button{font:inherit}.app{height:100%;display:flex;flex-direction:column}.hud{display:flex;gap:6px;padding:8px;background:#17130e;z-index:10}.pill{background:#241d15;border:1px solid #806233;border-radius:10px;padding:6px 9px;font-size:11px}.pill b{font-size:14px}.spacer{flex:1}.screen{position:relative;flex:1;overflow:hidden}.settlement{background:linear-gradient(#63765b,#334334)}.settlement:after{content:'';position:absolute;inset:45% 0 0;background:repeating-linear-gradient(45deg,#6c765d 0 55px,#59634e 55px 110px);opacity:.55}.title{position:absolute;z-index:5;top:10px;left:14px;font-weight:900;font-size:21px;text-shadow:0 2px 5px #000}.hint{position:absolute;z-index:5;top:39px;left:14px;font-size:11px;color:#eadcbf}.house{position:absolute;z-index:4;width:104px;height:90px;border:2px solid #a7834c;border-radius:15px;background:#382b20eF;box-shadow:0 12px 22px #0006;color:#f4e2bd;text-align:center}.house b{display:block;font-size:36px;margin-top:8px}.h1{left:6%;top:19%}.h2{right:5%;top:27%}.h3{left:10%;top:51%}.h4{right:8%;top:60%}.hero{position:absolute;z-index:6;width:66px;text-align:center;font-size:10px;font-weight:900}.hero img{width:60px;height:75px;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 5px 3px #0006)}.p1{left:39%;top:24%}.p2{left:19%;top:38%}.p3{left:63%;top:44%}.p4{left:40%;top:61%}.dock{display:flex;gap:6px;padding:8px;background:#15110d;z-index:10}.dock button{flex:1;padding:11px 3px;border-radius:10px;border:1px solid #806233;background:#282017;color:#f3dfb1;font-weight:900;font-size:11px}.dock .on{background:#657c3a}.panel{position:absolute;z-index:20;inset:12% 7% 12%;padding:18px;background:#18130fee;border:1px solid #9a743d;border-radius:18px;display:none;overflow:auto}.panel.show{display:block}.panel h2{margin:5px 0 10px}.action{width:100%;padding:13px;margin:7px 0;border-radius:11px;border:1px solid #806233;background:#60763a;color:white;font-weight:900}.close{float:right;background:none;border:0;color:white;font-size:24px}.map{background:#4b5947}.mapcard{position:absolute;left:10%;right:10%;padding:15px;background:#272017eF;border:1px solid #927042;border-radius:14px}.m1{top:23%}.m2{top:44%}.m3{top:65%;opacity:.5}.mission{background:#211b15}.room{position:absolute;left:5%;right:5%;top:15%;bottom:12%;border:5px solid #6d5941;border-radius:12px;background:repeating-linear-gradient(0deg,#56473a 0 42px,#493c31 42px 84px);box-shadow:inset 0 0 80px #0009;overflow:hidden}.tile{position:absolute;width:16%;height:13%;border:1px solid #77604a55;background:#302820aa}.t1{left:16%;top:34%}.t2{left:32%;top:34%}.t3{left:48%;top:47%}.t4{left:64%;top:47%}.rock{position:absolute;font-size:42px;z-index:3}.r1{left:35%;top:31%}.r2{left:58%;top:58%}.dog{position:absolute;right:8%;bottom:7%;font-size:55px;z-index:4;animation:pulse 1.8s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.unit{position:absolute;z-index:6;width:60px;height:82px;transition:left .45s ease,top .45s ease;text-align:center;font-size:9px;font-weight:900}.unit img{width:55px;height:70px;object-fit:contain;display:block}.u1{left:8%;top:12%}.u2{left:24%;top:20%}.u3{left:42%;top:12%}.u4{left:58%;top:22%}.missionbar{position:absolute;z-index:10;left:8px;right:8px;bottom:7px;display:flex;gap:5px}.missionbar button{flex:1;padding:10px 2px;background:#211a13;border:1px solid #806233;color:#f4dfb3;border-radius:9px;font-weight:900;font-size:10px}.objective{position:absolute;z-index:9;left:10px;right:10px;top:55px;background:#17130dcc;border:1px solid #806233;border-radius:9px;padding:7px;font-size:11px}.toast{position:absolute;z-index:30;left:10%;right:10%;top:42%;padding:16px;background:#18130ff5;border:1px solid #a07b43;border-radius:14px;text-align:center;font-weight:900;display:none}.toast.show{display:block}</style></head><body><div class="app"><div class="hud"><div class="pill">🪙 <b id="coins">500</b></div><div class="pill">⛏️ <b id="ore">120</b></div><div class="pill">🐕 <b id="dogs">0</b></div><div class="spacer"></div><div class="pill">LVL <b id="lvl">1</b></div></div><main id="screen" class="screen settlement"></main><nav class="dock"><button class="on" onclick="settlement()">🏠 OSADA</button><button onclick="showMap()">🗺️ MAPA</button><button onclick="showTeam()">👥 DRUŻYNA</button><button onclick="mission()">🐕 MISJA</button></nav></div><script>const A='https://cdn.shopify.com/s/files/1/1019/1903/1622/files/';const imgs={hanys:A+'bebok-hanys-game.jpg?v=1787894020',hopla:A+'bebok-hopla-game.jpg?v=1787894032',fachura:A+'bebok-fachura-game.jpg?v=1787894045',podciep:A+'bebok-podciep-game.jpg?v=1787894060'};let s=JSON.parse(localStorage.bebokV2||'{"coins":500,"ore":120,"dogs":0,"lvl":1}');let actions=0;const $=x=>document.getElementById(x);function save(){localStorage.bebokV2=JSON.stringify(s);$('coins').textContent=s.coins;$('ore').textContent=s.ore;$('dogs').textContent=s.dogs;$('lvl').textContent=s.lvl}function settlement(){actions=0;$('screen').className='screen settlement';$('screen').innerHTML=`<div class=title>OSADA BEBOKÓW</div><div class=hint>Twoja baza. Przygotuj drużynę i ruszaj na wyprawę.</div><div class="house h1" onclick="panel('🏠','SIEDZIBA','Centrum osady i miejsce przygotowania wypraw.')"><b>🏠</b>SIEDZIBA</div><div class="house h2" onclick="panel('⛏️','KOPALNIA','Wydobywaj rudę i rozwijaj osadę.')"><b>⛏️</b>KOPALNIA</div><div class="house h3" onclick="panel('🔧','WARSZTAT','Fachura buduje wyposażenie.')"><b>🔧</b>WARSZTAT</div><div class="house h4" onclick="panel('🐾','SCHRONISKO','Tutaj trafiają uratowane pieski.')"><b>🐾</b>SCHRONISKO</div>${hero('p1','hanys','Hanys')} ${hero('p2','hopla','Hopla')} ${hero('p3','fachura','Fachura')} ${hero('p4','podciep','Podciep')}<div id=panel class=panel></div>`;save()}function hero(cls,k,n){return `<div class="hero ${cls}" onclick="showTeam()"><img src="${imgs[k]}">${n}</div>`}function panel(i,n,d){$('panel').innerHTML=`<button class=close onclick="$('panel').classList.remove('show')">×</button><div style="font-size:55px">${i}</div><h2>${n}</h2><p>${d}</p><button class=action onclick="upgrade()">🔨 ULEPSZ OSADĘ — 100 🪙</button><button class=action onclick="mission()">🐕 WYRUSZ NA WYPRAWĘ</button>`;$('panel').classList.add('show')}function upgrade(){if(s.coins<100)return toast('Brakuje monet');s.coins-=100;s.ore+=25;s.lvl++;save();toast('Osada ulepszona! +25 rudy')}function showMap(){$('screen').className='screen map';$('screen').innerHTML=`<div class=title>MAPA KATOWIC</div><div class=hint>Wybierz miejsce, które chcesz zbadać.</div><div class="mapcard m1" onclick="mission()">🏚️ <b>PIWNICE KAMIENICY</b><br><small>🐕 Pies wyczuwa coś pod ziemią · GOTOWE</small></div><div class="mapcard m2">⛏️ <b>STARA KOPALNIA</b><br><small>🔒 Odblokuj po 3 uratowanych psach</small></div><div class="mapcard m3">🌆 <b>CENTRUM KATOWIC</b><br><small>🔒 Wkrótce</small></div>`}function showTeam(){$('screen').className='screen settlement';$('screen').innerHTML=`<div class=title>DRUŻYNA</div><div class=hint>Każdy Bebok ma inną specjalizację.</div>${hero('p1','hanys','Hanys · KOPIE')} ${hero('p2','hopla','Hopla · SZUKA')} ${hero('p3','fachura','Fachura · NAPRAWIA')} ${hero('p4','podciep','Podciep · OŚWIETLA')}<div class=panel style="display:block;top:66%;inset-inline:7%;bottom:8%"><b>💡 Zasada gry</b><p>Wybierasz Beboka, a następnie używasz jego specjalnej umiejętności w terenie.</p><button class=action onclick="mission()">🐕 ZACZNIJ MISJĘ</button></div>`}function mission(){actions=0;$('screen').className='screen mission';$('screen').innerHTML=`<div class=title>PIWNICE KAMIENICY</div><div class=objective>CEL: uratuj psa · wykonaj 3 właściwe działania</div><div class=room><div class="tile t1"></div><div class="tile t2"></div><div class="tile t3"></div><div class="tile t4"></div><div class="rock r1">🪨</div><div class="rock r2">🧱</div>${unit('u1','hanys','Hanys')} ${unit('u2','hopla','Hopla')} ${unit('u3','fachura','Fachura')} ${unit('u4','podciep','Podciep')}<div class=dog>🐶</div></div><div class=missionbar><button onclick="act('hanys')">⛏️ KOP</button><button onclick="act('hopla')">🪢 SZUKAJ</button><button onclick="act('fachura')">🔧 NAPRAW</button><button onclick="act('podciep')">🏮 ŚWIATŁO</button></div><div id=toast class=toast></div>`}function unit(c,k,n){return `<div id="${c}" class="unit ${c}"><img src="${imgs[k]}">${n}</div>`}function act(k){const el=$(k==='hanys'?'u1':k==='hopla'?'u2':k==='fachura'?'u3':'u4');const spots={hanys:['34%','31%'],hopla:['52%','43%'],fachura:['66%','55%'],podciep:['78%','40%']};el.style.left=spots[k][0];el.style.top=spots[k][1];actions++;toast(k==='hanys'?'Hanys usuwa zawał!':k==='hopla'?'Hopla znalazła ukryte przejście!':k==='fachura'?'Fachura uruchamia mechanizm!':'Podciep rozświetla tunel!');if(actions>=3){setTimeout(win,700)}}function win(){s.dogs++;s.coins+=120;s.ore+=15;save();toast('🐕 URATOWANY PIES! +120 🪙 +15 ⛏️');setTimeout(settlement,1200)}function toast(t){let x=$('toast');if(!x){alert(t);return}x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1000)}settlement();</script></body></html>
