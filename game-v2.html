<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Osada</title><style>html,body{margin:0;height:100%;background:#17130e;color:#f3e6ca;font-family:system-ui;overflow:hidden}#app{height:100%;display:flex;flex-direction:column}.hud{display:flex;gap:7px;padding:10px;position:relative;z-index:5}.pill{background:#241d15dd;border:1px solid #806233;border-radius:12px;padding:7px 10px;font-size:12px}.pill b{font-size:14px}.spacer{flex:1}.screen{flex:1;position:relative;overflow:hidden;background:linear-gradient(#53644c,#293329)}.ground{position:absolute;inset:12% 0 0;background:linear-gradient(135deg,transparent 48%,#637354 49%,#637354 51%,transparent 52%),linear-gradient(45deg,transparent 48%,#455640 49%,#455640 51%,transparent 52%);background-size:90px 90px;opacity:.6}.title{position:absolute;top:12px;left:15px;text-shadow:0 2px 5px #000;font-weight:900;font-size:22px}.hint{position:absolute;top:43px;left:15px;font-size:12px;color:#e1d2b2}.house{position:absolute;width:100px;height:88px;border:2px solid #b18a4d;border-radius:14px;background:#3a2c20ee;box-shadow:0 12px 20px #0005;text-align:center;cursor:pointer}.house span{display:block;font-size:35px;margin-top:10px}.house small{font-weight:800}.h1{left:8%;top:22%}.h2{right:7%;top:29%}.h3{left:14%;top:51%}.h4{right:12%;top:60%}.bebok{position:absolute;width:62px;text-align:center;font-size:11px;font-weight:800;filter:drop-shadow(0 5px 3px #0005);cursor:pointer}.bebok img{width:55px;height:70px;object-fit:contain;display:block;margin:auto}.b1{left:42%;top:26%}.b2{left:24%;top:38%}.b3{left:65%;top:45%}.b4{left:44%;top:59%}.dock{display:flex;gap:7px;padding:9px;background:#17130f}.dock button{flex:1;border:1px solid #806233;border-radius:11px;padding:12px 4px;background:#282017;color:#f3dfb1;font-weight:900}.dock button.primary{background:#687e38}.modal{position:absolute;inset:13% 8% 12%;z-index:20;background:#18130eee;border:1px solid #8b6938;border-radius:18px;padding:18px;display:none;overflow:auto}.modal.show{display:block}.close{float:right;border:0;background:none;color:#fff;font-size:22px}.action{display:block;width:100%;margin:10px 0;padding:13px;border-radius:12px;border:1px solid #806233;background:#5e7337;color:#fff;font-weight:900}.dog{font-size:70px;text-align:center;margin:25px}.mission{background:radial-gradient(circle at 50% 45%,#4c4030,#191510)}.room{position:absolute;inset:17% 7% 13%;border:5px solid #6c5740;border-radius:10px;background:repeating-linear-gradient(0deg,#544638 0 40px,#493c31 40px 80px);box-shadow:inset 0 0 80px #0008}.wall{position:absolute;background:#30271f}.w1{left:20%;top:35%;width:35%;height:35px}.w2{left:55%;top:58%;width:35%;height:35px}.dog2{position:absolute;right:10%;bottom:10%;font-size:55px}.unit{position:absolute;font-size:42px;transition:all .5s}.u1{left:15%;top:15%}.u2{left:30%;top:25%}.u3{left:43%;top:15%}.u4{left:56%;top:27%}.missionbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px}.missionbar button{flex:1;padding:12px 3px;background:#211a13;color:#f4dfb3;border:1px solid #806233;border-radius:10px;font-weight:900}</style></head><body><div id="app"><div class="hud"><div class="pill">🪙 <b id="coins">500</b></div><div class="pill">⛏️ <b id="ore">120</b></div><div class="pill">🐕 <b id="dogs">0</b></div><div class="spacer"></div><div class="pill">LVL <b id="lvl">1</b></div></div><main id="screen" class="screen"><div class="ground"></div><div class="title">OSADA BEBOKÓW</div><div class="hint">Kliknij budynek albo Beboka</div><div class="house h1" onclick="openHouse('🏠','SIEDZIBA','Centrum osady. Tu zaczyna się każda wyprawa.')"><span>🏠</span><small>SIEDZIBA</small></div><div class="house h2" onclick="openHouse('⛏️','KOPALNIA','Wydobywamy rudę na ulepszenia.')"><span>⛏️</span><small>KOPALNIA</small></div><div class="house h3" onclick="openHouse('🔧','WARSZTAT','Fachura buduje nowe wyposażenie.')"><span>🔧</span><small>WARSZTAT</small></div><div class="house h4" onclick="openHouse('🐾','SCHRONISKO','Tutaj trafiają uratowane pieski.')"><span>🐾</span><small>SCHRONISKO</small></div><div class="bebok b1" onclick="character('hanys','Górnik i budowniczy')"><img src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpg?v=1787894020">Hanys</div><div class="bebok b2" onclick="character('hopla','Zwiadowczyni')"><img src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game.jpg?v=1787894032">Hopla</div><div class="bebok b3" onclick="character('fachura','Wynalazca')"><img src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game.jpg?v=1787894045">Fachura</div><div class="bebok b4" onclick="character('podciep','Latarnik')"><img src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game.jpg?v=1787894060">Podciep</div><div id="modal" class="modal"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></main><nav class="dock"><button class="primary" onclick="settlement()">🏠 OSADA</button><button onclick="map()">🗺️ MAPA</button><button onclick="team()">👥 DRUŻYNA</button><button onclick="mission()">🐕 MISJA</button></nav></div><script>let s=JSON.parse(localStorage.bebokV2||'{"coins":500,"ore":120,"dogs":0,"lvl":1}');const $=id=>document.getElementById(id);function save(){localStorage.bebokV2=JSON.stringify(s);$('coins').textContent=s.coins;$('ore').textContent=s.ore;$('dogs').textContent=s.dogs;$('lvl').textContent=s.lvl}save();function openHouse(i,n,d){$('modalBody').innerHTML=`<div class=dog>${i}</div><h2>${n}</h2><p>${d}</p><button class=action onclick="upgrade()">🔨 ULEPSZ (100 🪙)</button><button class=action onclick="closeModal()">WRÓĆ DO OSADY</button>`;$('modal').classList.add('show')}function upgrade(){if(s.coins<100)return alert('Brakuje monet');s.coins-=100;s.ore+=25;s.lvl++;save();alert('Ulepszono!')}function character(n,d){$('modalBody').innerHTML=`<h2>${n.toUpperCase()}</h2><p>${d}</p><button class=action onclick="mission()">WYRUSZ Z NIM NA MISJĘ</button>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function team(){character('Drużyna','Hanys · Hopla · Fachura · Podciep. Każdy ma inną specjalizację.')}function map(){closeModal();$('screen').className='screen mission';$('screen').innerHTML='<div class=title>MAPA KATOWIC</div><div class=hint>Wybierz miejsce wyprawy</div><button class=action style="position:absolute;left:15%;top:28%;width:70%" onclick="mission()">🏚️ PIWNICE KAMIENICY<br><small>Nowa misja · 🐕 1 pies</small></button><button class=action style="position:absolute;left:15%;top:48%;width:70%">⛏️ STARA KOPALNIA<br><small>Odblokuj później</small></button><button class=action style="position:absolute;left:15%;top:68%;width:70%">🌆 CENTRUM KATOWIC<br><small>Odblokuj później</small></button>'}function mission(){closeModal();$('screen').className='screen mission';$('screen').innerHTML='<div class=title>PIWNICE KAMIENICY</div><div class=hint>🐕 Pies wyczuwa coś pod ziemią</div><div class=room><div class="wall w1"></div><div class="wall w2"></div><div class="unit u1">👾</div><div class="unit u2">👾</div><div class="unit u3">👾</div><div class="unit u4">👾</div><div class=dog2>🐶</div></div><div class=missionbar><button onclick="act('⛏️ Hanys: KOP')">⛏️ KOP</button><button onclick="act('🪢 Hopla: ZWIEDŹ')">🪢 ZWIEDŹ</button><button onclick="act('🔧 Fachura: NAPRAW')">🔧 NAPRAW</button><button onclick="act('🏮 Podciep: ŚWIATŁO')">🏮 ŚWIATŁO</button></div>'}let acts=0;function act(t){acts++;alert(t+' — wykonano akcję!');if(acts>=3){acts=0;s.dogs++;s.coins+=120;s.ore+=15;save();alert('🐕 URATOWANY PIES! +120 monet +15 rudy');settlement()}}function settlement(){location.reload()}</script></body></html>
