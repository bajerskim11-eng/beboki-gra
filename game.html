<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — Strażnicy Katowic</title><style>:root{--g:#d5a44d;--c:#ead8b3;--m:#a99b84}*{box-sizing:border-box}body{margin:0;background:#070706;color:#f4ead8;font-family:Arial,sans-serif}.app{width:min(100%,520px);min-height:100dvh;margin:auto;background:radial-gradient(circle at 50% 20%,#443a2c,#0b0a08 65%)}.screen{min-height:100dvh;padding:12px 12px 92px}.top{display:flex;align-items:center;gap:9px;background:#15130fef;border:1px solid #55452e;border-radius:16px;padding:7px;position:sticky;top:8px;z-index:5}.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--g)}.stats{display:flex;gap:12px;flex:1;font-size:10px;color:var(--m)}.stats b{display:block;color:#fff;font-size:14px}.btn{width:100%;border:1px solid #806233;border-radius:13px;background:linear-gradient(#687e38,#39491f);color:#fff;padding:14px 12px;font-weight:800;cursor:pointer}.gold{background:linear-gradient(#d9ad59,#876129);color:#1b150e}.ghost{background:#1a1713}.hero{text-align:center;padding:48px 15px 30px}.logo{font:900 42px Impact,Arial;letter-spacing:4px;color:var(--c);text-shadow:0 4px #3b2b1a}.sub{color:var(--g);letter-spacing:2px}.muted{color:var(--m);font-size:14px;line-height:1.45}.card{background:#1a1713ef;border:1px solid #59472e;border-radius:16px;padding:13px;margin:11px 0;box-shadow:0 7px 22px #0007}.title{font:900 24px Impact,Arial;letter-spacing:1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.building{padding:0;overflow:hidden;min-height:200px;position:relative}.building img{width:100%;height:150px;object-fit:cover;object-position:top}.building:after{content:"";position:absolute;left:0;right:0;top:70px;bottom:0;background:linear-gradient(transparent,#14110d)}.building .label{position:absolute;z-index:1;bottom:12px;left:11px;font-weight:900;font-size:16px}.scene{border:1px solid #59472e;border-radius:16px;overflow:hidden;background:#15120e}.scene img{width:100%;height:330px;object-fit:cover;object-position:top}.bubble{background:#f0dfbc;color:#34291d;border-radius:15px;padding:12px;margin:-22px 12px 12px;position:relative;font-weight:700}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);background:#11100ff5;border-top:1px solid #56452e;padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:10}.bottom button{background:none;border:0;color:#a99b84;font-size:10px;font-weight:800}.bottom .on{color:#e7c36e}.bottom span{display:block;font-size:20px;margin-bottom:2px}.map{height:500px;border:1px solid #59472e;border-radius:17px;position:relative;overflow:hidden;background:linear-gradient(145deg,#708166,#2d3d31 48%,#806b4b)}.map:after{content:"KATOWICE";position:absolute;bottom:18px;left:18px;font:900 32px Impact;color:#f0dfbc66}.pin{position:absolute;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#342716;border:2px solid var(--g);box-shadow:0 0 0 7px #d9ad5130;font-size:22px;z-index:2}.p1{left:26%;top:32%}.p2{left:62%;top:53%}.p3{left:42%;top:70%}.combat{height:520px;border:1px solid #59472e;border-radius:17px;overflow:hidden;position:relative;background:linear-gradient(#171714,#44372a 55%,#19120d)}.rock{position:absolute;background:#514638;border:2px solid #705d46;border-radius:30%}.r1{width:160px;height:100px;left:0;bottom:120px}.r2{width:150px;height:100px;right:0;top:110px}.char{position:absolute;width:105px;text-align:center;bottom:120px}.char img{width:88px;height:145px;object-fit:cover;object-position:top;border-radius:14px;filter:drop-shadow(0 8px 8px #0009)}.c1{left:0}.c2{left:25%;bottom:150px}.c3{left:50%;bottom:125px}.c4{right:0;bottom:145px}.dog{position:absolute;right:30px;bottom:72px;font-size:55px}.tools{position:absolute;bottom:9px;left:9px;right:9px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tools button{height:56px;border:1px solid #765a32;border-radius:12px;background:#201b15;color:#e6c476;font-size:24px}.bar{height:8px;background:#342c22;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#849c43}.mission{display:flex;align-items:center;gap:10px}.mission .ico{font-size:28px}input{width:100%;padding:13px;margin:6px 0 12px;background:#0e0d0b;border:1px solid #59472e;border-radius:10px;color:#fff}@media(min-width:700px){body{padding:20px}.app{border-radius:25px;box-shadow:0 0 60px #000}}</style><div id="app" class="app"></div><script>const C={hanys:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpg?v=1787894020',hopla:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game.jpg?v=1787894032',fachura:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game.jpg?v=1787894045',podciep:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game.jpg?v=1787894060'};let s=JSON.parse(localStorage.bebokGame||'null')||{page:'start',coins:500,ore:120,dogs:0,xp:0};const save=()=>localStorage.bebokGame=JSON.stringify(s),go=p=>{s.page=p;save();render()};function top(){return `<div class=top><img class=avatar src=${C.podciep}><div class=stats><div><b>${s.coins}</b>monety</div><div><b>${s.ore}</b>ruda</div><div><b>${s.dogs}/10</b>psy</div></div><span>⚙️</span></div>`}function nav(a){return `<nav class=bottom>${[['settlement','🏠','Osada'],['map','🗺️','Mapa'],['team','👥','Drużyna'],['missions','📜','Misje'],['inventory','🎒','Ekwipunek']].map(x=>`<button class=${a==x[0]?'on':''} onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function start(){return `<section class=screen><div class=hero><div class=logo>BEBOKI</div><div class=sub>STRAŻNICY KATOWIC</div><p class=muted>Katowice kryją więcej tajemnic, niż myślisz.</p><button class='btn gold' onclick="go('login')">ZAGRAJ</button><button class='btn ghost' style="margin-top:9px" onclick="go('login')">ZALOGUJ SIĘ</button><button class='btn ghost' style="margin-top:9px" onclick="guest()">GRAJ JAKO GOŚĆ</button></div><div class=card><b>Pierwsza misja</b><p class=muted>🐕 Pieski wyczuwają coś pod ziemią. Pomóż Bebokom sprawdzić, co kryje się w piwnicach.</p></div></section>`}function login(){return `<section class=screen><div class=hero><div class=logo style="font-size:32px">BEBOKI</div><div class=sub>WEJDŹ DO GRY</div></div><div class=card><div class=muted>E-MAIL</div><input><div class=muted>HASŁO</div><input type=password><button class='btn gold' onclick="guest()">WEJDŹ DO OSADY</button></div><button class='btn ghost' onclick="go('start')">WRÓĆ</button></section>`}function settlement(){return `<section class=screen>${top()}<div style="padding:18px 4px 7px"><div class=title>OSADA BEBOKÓW</div><div class=muted>Twoja baza. Tutaj zaczyna się każda wyprawa.</div></div><div class=card><b>🐕 Psy uratowane: ${s.dogs}/10</b><div class=bar><i style="width:${s.dogs*10}%"></i></div><button class='btn gold' style="margin-top:10px" onclick="go('map')">🗺️ WYRUSZ NA MAPĘ KATOWIC</button></div><div class=grid>${[['mine',C.hanys,'⛏️ Kopalnia Hanysa'],['workshop',C.fachura,'🔧 Warsztat Fachury'],['lighthouse',C.podciep,'🏮 Latarnia Podciepa'],['shelter',C.hopla,'🐾 Schronisko']].map(x=>`<div class='card building' onclick="go('${x[0]}')"><img src=${x[1]}><div class=label>${x[2]}</div></div>`).join('')}</div></section>${nav('settlement')}`}function building(p){let d={mine:['KOPALNIA HANYSA',C.hanys,'Tu kopie się głębiej, niż sięga zwykła wyobraźnia.','⛏️ KOP GŁĘBIEJ'],workshop:['WARSZTAT FACHURY',C.fachura,'Fachura buduje sprzęt, który pomaga całej osadzie.','🔧 ZBUDUJ'],lighthouse:['LATARNIA PODCIEPA',C.podciep,'Podciep oświetla ukryte przejścia i sekrety.','🏮 ODKRYJ SEKRET'],shelter:['SCHRONISKO DLA PSÓW',C.hopla,'Każdy uratowany pies dostaje tutaj własne miejsce.','🐕 OPIEKA']}[p];return `<section class=screen>${top()}<button class='btn ghost' onclick="go('settlement')">← OSADA</button><div class=scene style="margin-top:10px"><img src=${d[1]}><div class=bubble><b>${d[0]}</b><br>${d[2]}</div></div><div class=card><b>POZIOM 1</b><p class=muted>Ulepsz budynek, aby odblokować nowe możliwości.</p><button class='btn gold' onclick="upgrade()">${d[3]}</button></div></section>`}function upgrade(){s.coins+=50;s.ore=Math.max(0,s.ore-20);save();alert('Ulepszenie rozpoczęte!');render()}function map(){return `<section class=screen>${top()}<div class=title style="margin:18px 4px 8px">MAPA KATOWIC</div><div class=map><div class='pin p1' onclick="go('mission')">🐾</div><div class='pin p2'>⛏️</div><div class='pin p3'>🏮</div></div><div class='card mission'><div class=ico>🐕</div><div style="flex:1"><b>Piwnice kamienicy</b><div class=muted>Pies wyczuwa coś pod ziemią.</div></div><button class='btn gold' onclick="go('mission')" style="width:auto">WEJDŹ</button></div></section>${nav('map')}`}function mission(){return `<section class=screen>${top()}<button class='btn ghost' onclick="go('map')">← MAPA</button><div class=hero style="padding:28px 5px"><div class=title>PIWNICE KAMIENICY</div><p class=muted>Pieski wyczuwają coś pod ziemią. Sprawdź, co się tam kryje.</p></div><div class=card><b>CEL MISJI</b><p>🐕 Dotrzemy do pieska 0/1</p><p>🦴 Zbierz kości 0/6</p><p>🔮 Odkryj skrzynię 0/1</p><button class='btn ghost' onclick="go('team')">WYBIERZ DRUŻYNĘ</button><button class='btn gold' style="margin-top:8px" onclick="go('gameplay')">ROZPOCZNIJ</button></div></section>`}function team(){return `<section class=screen>${top()}<div class=title style="margin:18px 4px">DRUŻYNA BEBOKÓW</div>${[['hanys','Hanys','Budowniczy'],['hopla','Hopla','Zwiadowczyni'],['fachura','Fachura','Wynalazca'],['podciep','Podciep','Latarnik']].map(x=>`<div class=card style="display:flex;gap:12px;align-items:center"><img src=${C[x[0]]} style="width:68px;height:90px;object-fit:cover;object-position:top;border-radius:12px"><div><b>${x[1]}</b><div class=muted>${x[2]}</div></div></div>`).join('')}<button class='btn gold' onclick="go('gameplay')">START WYPRAWY</button></section>${nav('team')}`}function gameplay(){return `<section class=screen>${top()}<div class=combat><span class=tag style="position:absolute;top:10px;left:10px">MISJA 1 · URATUJ PIESKA</span><div class='rock r1'></div><div class='rock r2'></div>${[['hanys','c1'],['hopla','c2'],['fachura','c3'],['podciep','c4']].map(x=>`<div class='char ${x[1]}'><img src=${C[x[0]]}></div>`).join('')}<div class=dog>🐶</div><div class=tools><button onclick="act('⛏️')">⛏️</button><button onclick="act('🪢')">🪢</button><button onclick="act('🔧')">🔧</button><button onclick="act('🏮')">🏮</button></div></div><div class=card><b id=msg>Coś jest za tym zawałem…</b><div class=muted>Użyj umiejętności Beboków, żeby przejść przez piwnicę.</div></div></section>`}function act(i){let m={'⛏️':'Hanys przebija zawał!','🪢':'Hopla zabezpiecza przejście!','🔧':'Fachura uruchamia mechanizm!','🏮':'Podciep oświetla ukryte przejście!'};document.getElementById('msg').textContent=m[i];s.xp+=10;if(i==='⛏️')s.ore+=5;if(s.xp>=30)go('reward');else save()}function reward(){s.dogs++;s.coins+=120;s.xp=0;save();return `<section class=screen><div class=hero><div style="font-size:60px">🐾</div><div class=title>MISJA WYKONANA!</div><p class=muted>Piesek jest bezpieczny. Drużyna wraca do osady.</p></div><div class=scene><img src=${C.hopla}><div class=bubble>„Mamy go! ❤️”</div></div><div class=card><b>NAGRODY</b><p>🪙 +120 monet</p><p>⛏️ +5 rudy</p><p>🐕 +1 uratowany pies</p></div><button class='btn gold' onclick="go('settlement')">WRÓĆ DO OSADY</button></section>`}function inventory(){return `<section class=screen>${top()}<div class=title style="margin:18px 4px">EKWIPUNEK</div><div class=grid>${['⛏️','🪢','🏮','🔧','🧪','💎','🦴','🗝️'].map((x,i)=>`<div class=card style="text-align:center;font-size:34px">${x}<div class=muted>x${i+1}</div></div>`).join('')}</div></section>${nav('inventory')}`}function missions(){return `<section class=screen>${top()}<div class=title style="margin:18px 4px">MISJE</div>${['Piwnice kamienicy','Zaginiony piesek','Stara kopalnia'].map((x,i)=>`<div class=card mission><div class=ico>🐾</div><div style="flex:1"><b>${x}</b><div class=muted>${i?'Odblokuj później.':'Pies wyczuwa coś pod ziemią.'}</div></div><button class='btn ${i?'ghost':'gold'}' onclick="go('mission')" style="width:auto">${i?'🔒':'WYRUSZ'}</button></div>`).join('')}</section>${nav('missions')}`}function guest(){s.page='settlement';save();render()}function render(){let p=s.page;app.innerHTML=p==='start'?start():p==='login'?login():p==='settlement'?settlement():['mine','workshop','lighthouse','shelter'].includes(p)?building(p):p==='map'?map():p==='mission'?mission():p==='team'?team():p==='gameplay'?gameplay():p==='reward'?reward():p==='inventory'?inventory():p==='missions'?missions():start()}render();</script>
