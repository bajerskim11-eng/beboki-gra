const loader=new THREE.TextureLoader();loader.crossOrigin='anonymous';const units=[];function addBebok(name,x,z,scale){const g=new THREE.Group();g.userData={name,role:info[name][0],desc:info[name][1]};const tex=loader.load(urls[name],()=>{tex.colorSpace=THREE.SRGBColorSpace});tex.colorSpace=THREE.SRGBColorSpace;const mat=new THREE.ShaderMaterial({uniforms:{map:{value:tex},bg:{value:new THREE.Color(0.52,0.50,0.48)},cut:{value:.105},soft:{value:.035}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform sampler2D map;uniform vec3 bg;uniform float cut;uniform float soft;varying vec2 vUv;void main(){vec4 c=texture2D(map,vUv);float d=distance(c.rgb,bg);float a=smoothstep(cut,cut+soft,d);if(a<.015)discard;gl_FragColor=vec4(c.rgb,a);}',transparent:true,depthWrite:false});const spr=new THREE.Sprite(mat);spr.scale.set(scale*.67,scale,1);spr.position.y=scale*.5+.12;g.add(spr);const sh=new THREE.Mesh(new THREE.CircleGeometry(.58,32),new THREE.MeshBasicMaterial({color:0x050706,transparent:true,opacity:.38,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.scale.set(1.2,.55,1);sh.position.y=.025;g.add(sh);g.position.set(x,0,z);S.add(g);units.push(g);return g}addBebok('Hanys',-2.8,.6,3.2);addBebok('Hopla',-.9,2.7,3.05);addBebok('Fachura',2.2,1.8,3.15);addBebok('Podciep',-.1,-2.25,3.15);
let selected=null,target=null;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function select(e){const r=R.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,C);const hits=ray.intersectObjects(units.flatMap(u=>u.children),true);if(!hits.length)return;let o=hits[0].object;while(o.parent&&!o.userData.name)o=o.parent;if(!o.userData.name)return;selected=o;document.querySelector('#name').textContent=o.userData.name;document.querySelector('#role').textContent=o.userData.role;document.querySelector('#desc').textContent=o.userData.desc;document.querySelector('#panel').classList.add('open')}R.domElement.addEventListener('pointerup',select);document.querySelector('#close').onclick=()=>document.querySelector('#panel').classList.remove('open');document.querySelector('#go').onclick=()=>{if(selected)target=new THREE.Vector3((Math.random()*8)-4,0,(Math.random()*7)-2)};document.querySelector('#mission').onclick=()=>{if(selected)document.querySelector('#desc').textContent='Misja: pies wyczuł coś pod ziemią. Wybierz IDŹ TUTAJ, aby wysłać Beboka.'};const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);for(const u of units){u.children[0].position.y=(parseFloat(u.children[0].scale.y)||3.1)*.5+.12+Math.sin(performance.now()*.0016+u.position.x)*.035}if(selected&&target){const d=target.clone().sub(selected.position);d.y=0;if(d.length()>.12){d.normalize();selected.position.addScaledVector(d,dt*2.2)}else target=null}dog.rotation.y=Math.sin(performance.now()*.0008)*.08;O.update();R.render(S,C)}loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});</script></body></html>
