<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki 3D — Osada</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10140f;font-family:system-ui;color:#f5ead2}#game{width:100%;height:100%}.hud{position:fixed;z-index:10;top:0;left:0;right:0;padding:12px;display:flex;gap:8px;pointer-events:none}.chip{background:#211c15dd;border:1px solid #8e7040;border-radius:12px;padding:8px 10px;font-size:12px;backdrop-filter:blur(8px)}.chip b{font-size:14px}.spacer{flex:1}.panel{position:fixed;z-index:20;left:12px;right:12px;bottom:12px;padding:14px;border-radius:18px;background:#17140fe8;border:1px solid #8e7040;backdrop-filter:blur(10px);transform:translateY(120%);transition:.25s}.panel.open{transform:none}.panel h2{margin:0 0 4px;font-size:20px}.panel p{margin:4px 0 12px;color:#d5c7aa;font-size:13px}.actions{display:flex;gap:7px}.actions button{flex:1;border:1px solid #806233;background:#31452a;color:#fff;border-radius:11px;padding:11px;font-weight:800}.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#5f7136;font-size:11px}.help{position:fixed;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 10px;border-radius:10px;background:#17140fcc;font-size:11px;color:#ddd0b5;pointer-events:none}</style></head><body><div id="game"></div><div class="hud"><div class="chip">🪙 <b>500</b></div><div class="chip">⛏️ <b>120</b></div><div class="chip">🐕 <b id="dogs">0</b></div><div class="spacer"></div><div class="chip">3D PROTOTYPE</div></div><div id="panel" class="panel"><span id="role" class="badge">BEBOK</span><h2 id="name">Hanys</h2><p id="desc">Wybierz postać i wydaj jej polecenie.</p><div class="actions"><button id="go">IDŹ TUTAJ</button><button id="mission">MISJA</button><button id="close">ZAMKNIJ</button></div></div><div class="help">Dotknij Beboka • przeciągnij, aby obrócić kamerę • scroll = zoom</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x66705c);scene.fog=new THREE.Fog(0x66705c,18,42);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(9,9,13);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#game').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.minDistance=8;controls.maxDistance=25;controls.maxPolarAngle=Math.PI*.46;
scene.add(new THREE.HemisphereLight(0xfff0d0,0x34402e,2.1));const sun=new THREE.DirectionalLight(0xffe1ad,3);sun.position.set(-8,14,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),mat(0x536049));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const path=new THREE.Mesh(new THREE.PlaneGeometry(5,34),mat(0x7c6a4c));path.rotation.x=-Math.PI/2;path.position.y=.01;scene.add(path);
function house(x,z,w,h,d,label){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(0x80634b));body.position.y=h/2;body.castShadow=body.receiveShadow=true;g.add(body);const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,1.8,4),mat(0x49352b));roof.rotation.y=Math.PI/4;roof.position.y=h+0.9;roof.castShadow=true;g.add(roof);const door=new THREE.Mesh(new THREE.BoxGeometry(.75,1.5,.12),mat(0x2a211a));door.position.set(0,.75,d/2+.07);g.add(door);g.position.set(x,0,z);g.userData={label};scene.add(g);return g}house(-6,-5,4,3.2,4,'SIEDZIBA');house(6,-4,4,3.2,4,'KOPALNIA');house(-5,5,4,3,4,'WARSZTAT');house(5,6,4,3,4,'SCHRONISKO');
// Temporary 3D character rig: geometry is deliberately modular so canonical Bebok art can replace meshes without changing gameplay code.
const specs={Hanys:{fur:0x6d8b36,cloth:0x4f6841,tool:0x5a4630,role:'GÓRNIK',desc:'Kopanie i usuwanie zawałów.'},Hopla:{fur:0xd9b8b7,cloth:0xe7a4b4,tool:0x777777,role:'ZWIADOWCZYNI',desc:'Wykrywanie dróg i sekretów.'},Fachura:{fur:0x6d95ad,cloth:0x41617d,tool:0x3e9ed4,role:'WYNALAZCA',desc:'Mechanizmy i naprawy.'},Podciep:{fur:0x88808e,cloth:0x3e3153,tool:0x6b4c2d,role:'LATARNIK',desc:'Światło i odkrywanie ukrytych miejsc.'}};
function bebok(name,x,z){const s=specs[name],g=new THREE.Group();g.userData={name,...s};const fur=mat(s.fur),cloth=mat(s.cloth);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.52,1.15,8,16),cloth);body.position.y=1.05;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.68,20,16),fur);head.scale.set(1,.95,.9);head.position.y=2.05;head.castShadow=true;g.add(head);for(const side of[-1,1]){const ear=new THREE.Mesh(new THREE.ConeGeometry(.28,.8,4),fur);ear.rotation.z=side<0?.75:-.75;ear.rotation.y=side*.15;ear.position.set(side*.62,2.18,0);g.add(ear)}const eyeMat=mat(0x17130e,.25);for(const side of[-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),eyeMat);eye.position.set(side*.23,2.15,.58);g.add(eye)}const hair=new THREE.Mesh(new THREE.SphereGeometry(.6,12,8),mat(name==='Hanys'?0x7f9e3e:name==='Hopla'?0xe34891:name==='Fachura'?0x1976c4:0x674878));hair.scale.set(1.05,.55,1);hair.position.set(0,2.52,.02);g.add(hair);if(name==='Podciep'){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.35,8),mat(0x49352b));pole.position.set(.75,1.15,.1);g.add(pole);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),mat(0xffbd55,.3));lamp.position.set(.75,1.85,.1);g.add(lamp)}else{const tool=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,1.2),mat(s.tool));tool.rotation.z=-.8;tool.position.set(.65,1.25,.15);g.add(tool)}g.position.set(x,0,z);scene.add(g);return g}
const units=[bebok('Hanys',-1.7,-1),bebok('Hopla',-.3,.4),bebok('Fachura',2,.8),bebok('Podciep',1.2,-2)];
const dog=new THREE.Group();const dm=mat(0xc3a17b);const db=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),dm);db.scale.set(1.15,.8,1.35);db.position.y=.5;dog.add(db);const dh=new THREE.Mesh(new THREE.SphereGeometry(.4,16,12),dm);dh.position.set(0,.78,.45);dog.add(dh);dog.position.set(4,0,3.5);dog.userData={name:'PIESEK',desc:'Coś wyczuł pod ziemią.'};scene.add(dog);
let selected=null,target=null;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function show(u){selected=u;$('name').textContent=u.userData.name;$('role').textContent=u.userData.role;$('desc').textContent=u.userData.desc;document.querySelector('#panel').classList.add('open')}function $(q){return document.querySelector(q)}function pick(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(scene.children,true);for(const h of hits){let o=h.object;while(o.parent&&!o.userData.name)o=o.parent;if(o.userData.name){if(specs[o.userData.name])show(o);else if(o.userData.name==='PIESEK'){show(o);$('role').textContent='CEL MISJI'}break}}}renderer.domElement.addEventListener('pointerup',pick);$('#close').onclick=()=>$('#panel').classList.remove('open');$('#go').onclick=()=>{if(!selected)return;const p=new THREE.Vector3((Math.random()*8)-4,0,(Math.random()*8)-2);target=p;};$('#mission').onclick=()=>{if(selected){$('desc').textContent='Polecenie: znajdź psa. Dotknij miejsca na ziemi, aby wysłać Beboka.'}};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(selected&&target){const dir=target.clone().sub(selected.position);dir.y=0;if(dir.length()>.15){dir.normalize();selected.position.addScaledVector(dir,dt*2.2);selected.rotation.y=Math.atan2(dir.x,dir.z)}else target=null}controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
