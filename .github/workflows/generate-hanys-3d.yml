name: Generate Hanys 3D Model

on:
  push:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install TripoSR
        run: |
          python -m pip install --upgrade pip setuptools wheel
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git tools/hanys-3d/TripoSR
          python -m pip install -r tools/hanys-3d/requirements.txt
          python -m pip install -r tools/hanys-3d/TripoSR/requirements.txt

      - name: Download Hanys reference
        run: |
          curl -L --fail https://raw.githubusercontent.com/bajerskim11-eng/beboki-katowice-mis/main/public/beboki/hanys.jpeg -o tools/hanys-3d/hanys-reference.jpeg

      - name: Generate GLB on CPU fallback
        working-directory: tools/hanys-3d
        run: |
          python TripoSR/run.py hanys-reference.jpeg --device cpu --output-dir output --model-save-format glb --mc-resolution 128
          mkdir -p ../../public/models
          cp output/0/mesh.glb ../../public/models/hanys.glb

      - name: Commit generated model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/hanys.glb
          git diff --cached --quiet || git commit -m 'Generate Hanys 3D GLB from reference image'
          git push