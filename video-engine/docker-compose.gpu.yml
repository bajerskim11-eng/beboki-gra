services:
  beboki-video-api:
    build: .
    ports:
      - "8080:8000"
    environment:
      COMFYUI_URL: http://comfyui:8188
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      - comfyui

  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.comfyui
    ports:
      - "8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
