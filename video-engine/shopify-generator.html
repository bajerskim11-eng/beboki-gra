<section id="bebok-video-generator" style="max-width:760px;margin:40px auto;padding:24px;border:1px solid #ddd;border-radius:16px;font-family:system-ui;background:#fff">
  <h2>🎬 Stwórz historię Beboka</h2>
  <p style="color:#666">Pierwszy test korzysta z darmowego endpointu NVIDIA Cosmos3 Nano.</p>
  <label>Postać</label>
  <select id="bebok-character" style="display:block;width:100%;padding:10px;margin:8px 0 16px"></select>
  <label>Silnik</label>
  <select id="bebok-provider" style="display:block;width:100%;padding:10px;margin:8px 0 16px">
    <option value="nvidia">NVIDIA Cosmos3 Nano — pierwszy test</option>
    <option value="comfy">ComfyUI / Wan — GPU worker</option>
  </select>
  <label>Pomysł na scenę</label>
  <textarea id="bebok-prompt" rows="6" style="display:block;width:100%;padding:10px;margin:8px 0 16px" placeholder="Fachura nocą schodzi pod Spodek. Słyszy dziwny dźwięk, odgarnia kamienie dwoma świecącymi niebieskimi kilofami i znajduje starą magiczną skrzynię."></textarea>
  <button id="bebok-generate" style="padding:12px 18px;border:0;border-radius:10px;cursor:pointer">🎬 Generuj ujęcie</button>
  <pre id="bebok-status" style="white-space:pre-wrap;margin-top:16px"></pre>
  <video id="bebok-video" controls playsinline style="display:none;width:100%;margin-top:20px;border-radius:12px"></video>
</section>

<script>
(async () => {
  const API = window.BEBOKI_VIDEO_API || 'https://YOUR-BEBOKI-API.example.com';
  const select = document.querySelector('#bebok-character');
  const provider = document.querySelector('#bebok-provider');
  const prompt = document.querySelector('#bebok-prompt');
  const button = document.querySelector('#bebok-generate');
  const status = document.querySelector('#bebok-status');
  const video = document.querySelector('#bebok-video');

  try {
    const response = await fetch(`${API}/characters`);
    const data = await response.json();
    for (const character of data.characters) {
      const option = document.createElement('option');
      option.value = character.id;
      option.textContent = character.name;
      select.appendChild(option);
    }
  } catch (error) {
    status.textContent = 'Nie można połączyć z silnikiem video. Sprawdź adres API.';
  }

  button.addEventListener('click', async () => {
    if (prompt.value.trim().length < 3) return;
    button.disabled = true;
    video.style.display = 'none';
    status.textContent = '⏳ Generuję ujęcie...';
    try {
      const response = await fetch(`${API}/generate`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({character_id: select.value, provider: provider.value, scene_prompt: prompt.value.trim(), width: 512, height: 512, frames: 33})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Generation failed');
      if (data.video_url) {
        video.src = `${API}${data.video_url}`;
        video.style.display = 'block';
        status.textContent = `✅ Gotowe!\nBebok: ${data.character_id}\nSilnik: ${data.provider}\nSeed: ${data.seed}`;
      } else {
        status.textContent = `✅ Job uruchomiony.\nBebok: ${data.character_id}\nSilnik: ${data.provider}\nSeed: ${data.seed}\nPrompt ID: ${data.prompt_id}`;
      }
    } catch (error) {
      status.textContent = `❌ ${error.message}`;
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
