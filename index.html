<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — gra</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080705;color:#fff;min-height:100%;font-family:Arial,sans-serif}#app{min-height:100dvh;display:flex;justify-content:center}.phone{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:#111}.screen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.screen.active{display:block}.hot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer}.back{position:absolute;z-index:7;top:10px;left:10px;width:54px;height:54px;border:0;border-radius:50%;background:#17120ddd;color:#f1d28b;font-size:28px}.toast{position:absolute;z-index:8;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 15px;border-radius:13px;background:#17120de8;border:1px solid #a77935;color:#f4dfae;font-weight:800;font-size:12px;white-space:nowrap}.start{position:absolute;inset:0;z-index:20;background:linear-gradient(180deg,#08070622,#080706 80%),url('https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-osada-mobile.png?v=1787895922') center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:30px 20px 55px}.start h1{font-size:48px;letter-spacing:5px;margin:0;text-shadow:0 4px #2c1c0c}.start p{color:#d9ae5c;letter-spacing:2px;font-weight:900}.start button{width:100%;padding:16px;border-radius:15px;margin-top:9px;border:1px solid #c28e3c;background:linear-gradient(#e0b863,#8c6028);font-weight:900;font-size:16px;color:#21160b}.start .secondary{background:#17120de8;color:#ead8b3}.hidden{display:none!important}</style></head><body><div id="app"><div class="phone"><div id="start" class="start"><h1>BEBOKI</h1><p>STRAŻNICY KATOWIC</p><button onclick="show('settlement')">🎮 ZAGRAJ</button><button class="secondary" onclick="show('settlement')">GRAJ JAKO GOŚĆ</button></div><img id="settlement" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-osada-mobile.png?v=1787895922"><img id="map" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-mapa.png?v=1787895766"><img id="mission" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-piwnice.png?v=1787895778"><img id="dialog" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-dialog.png?v=1787895789"><img id="gameplay" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-gameplay.png?v=1787895803"><img id="reward" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-misja-wykonana.png?v=1787895816"><img id="dog" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-piesek.png?v=1787895834"><img id="team" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-game-druzyna.png?v=1787895674"><img id="workshop" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-warsztat.png?v=1787895859"><img id="podciep" class="screen" src="https://cdn.shopify.com/s/files/1/1019/1903/1622/files/beboki-ui-podciep.png?v=1787895874"><button class="hot" data-go="map" style="right:0;top:0;width:23%;height:12%"></button><button class="hot" data-go="map" style="left:0;bottom:0;width:20%;height:13%"></button><button class="hot" data-go="team" style="left:40%;bottom:0;width:20%;height:13%"></button><button class="hot" data-go="mission" style="left:60%;top:20%;width:40%;height:25%"></button><button class="hot" data-go="workshop" style="left:50%;top:47%;width:48%;height:25%"></button><button class="hot" data-go="mission" style="left:18%;top:20%;width:64%;height:50%"></button><button class="hot" data-go="dialog" style="left:0;bottom:0;width:100%;height:20%"></button><button class="hot" data-go="gameplay" style="left:0;bottom:0;width:100%;height:22%"></button><button class="hot" data-go="reward" style="left:0;bottom:0;width:100%;height:18%"></button><button class="hot" data-go="dog" style="left:0;bottom:0;width:100%;height:18%"></button><button class="hot" data-go="workshop" style="left:0;bottom:0;width:100%;height:20%"></button><button class="hot" data-go="podciep" style="left:0;bottom:0;width:100%;height:20%"></button><button id="back" class="back hidden" onclick="back()">‹</button><div id="toast" class="toast">Osada Beboków — dotknij budynku albo rusz na mapę</div></div></div><script>let current='settlement',history=[];const start=document.getElementById('start'),backBtn=document.getElementById('back'),toast=document.getElementById('toast');function show(id,push=true){let el=document.getElementById(id);if(!el)return;if(push&&current!==id)history.push(current);current=id;start.classList.add('hidden');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));el.classList.add('active');backBtn.classList.toggle('hidden',history.length===0);toast.textContent={settlement:'Osada Beboków — wybierz miejsce',map:'Mapa Katowic — znajdź aktywną misję',mission:'Piwnice kamienicy — wybierz drużynę',dialog:'Hopla ma trop — ruszamy!',gameplay:'Misja — użyj umiejętności Beboków',reward:'Misja wykonana — pies uratowany!',dog:'Nowy piesek w schronisku!',team:'Drużyna Beboków',workshop:'Warsztat Fachury',podciep:'Podciep — odkrywca sekretów'}[id]||'Beboki'}function back(){show(history.pop()||'settlement',false)}document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));document.querySelectorAll('img').forEach(i=>i.addEventListener('error',()=>{toast.textContent='Grafika nie załadowała się — sprawdzam CDN'}));show('settlement',false)</script></body></html>
