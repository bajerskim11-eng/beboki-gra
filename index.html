<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beboki — gra</title><style>:root{--bg:#100d09;--line:#70562f;--gold:#d8ad5b;--text:#f4ead8;--muted:#ad9d84}*{box-sizing:border-box}body{margin:0;background:#080706;color:var(--text);font-family:Arial,sans-serif}.app{width:min(100%,520px);min-height:100dvh;margin:auto;background:radial-gradient(circle at 50% 0,#4a3b28,#100d09 60%)}.screen{padding:14px 14px 90px;min-height:100dvh}.hero{text-align:center;padding:55px 10px 28px}.logo{font-size:48px;font-weight:900;letter-spacing:4px;text-shadow:0 4px #332515}.sub{color:var(--gold);letter-spacing:2px;font-weight:800}.muted{color:var(--muted);line-height:1.45}.card{background:#1d1812ee;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.btn{display:block;width:100%;border:1px solid #8b6b39;border-radius:13px;padding:14px;margin:8px 0;background:linear-gradient(#718844,#3e5125);color:white;font-weight:900;font-size:14px}.gold{background:linear-gradient(#d9b05f,#91652c);color:#21170c}.ghost{background:#17130f}.top{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:15px;background:#17130eee}.top img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--gold)}.stats{display:flex;justify-content:space-around;flex:1;font-size:10px;color:var(--muted)}.stats b{display:block;color:#fff;font-size:14px}.title{font-size:25px;font-weight:900;margin:16px 2px 4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.building{padding:0;overflow:hidden;position:relative;min-height:190px}.building img{width:100%;height:150px;object-fit:cover;object-position:top}.building .label{padding:10px;font-weight:900}.scene img{width:100%;height:310px;object-fit:cover;object-position:top;border-radius:14px}.bar{height:8px;background:#3a3024;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#789344}.map{height:470px;border-radius:17px;border:1px solid var(--line);position:relative;background:linear-gradient(135deg,#73816a,#3b4b3b 45%,#806a4b);overflow:hidden}.map:before{content:'KATOWICE';position:absolute;left:16px;bottom:14px;font-size:32px;font-weight:900;color:#fff5}.pin{position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:#302316;color:white;font-size:25px}.p1{left:24%;top:28%}.p2{left:62%;top:52%}.p3{left:43%;top:72%}.mission{display:flex;align-items:center;gap:10px}.mission .btn{width:auto;margin:0}.combat{height:500px;border-radius:17px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(#171716,#564633 65%,#17100b)}.char{position:absolute;bottom:105px;width:25%;text-align:center}.char img{width:80px;height:135px;object-fit:cover;object-position:top;border-radius:12px;filter:drop-shadow(0 8px 6px #000)}.c1{left:0}.c2{left:25%;bottom:140px}.c3{left:50%;bottom:112px}.c4{left:75%;bottom:138px}.dog{position:absolute;right:28px;bottom:60px;font-size:55px}.rocks{position:absolute;left:0;bottom:130px;width:45%;height:90px;background:#514637;border-radius:35%;border:2px solid #705d46}.tools{position:absolute;left:10px;right:10px;bottom:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tools button{height:55px;border-radius:12px;border:1px solid #806033;background:#211b15;color:#e6c476;font-size:23px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);background:#11100ff7;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:none;color:var(--muted);font-size:10px;font-weight:800}.bottom button.active{color:#f0c76b}.bottom span{display:block;font-size:20px}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0e0c09;color:#fff;margin:5px 0 12px}</style></head><body><main id="app" class="app"></main><script>const ROOT=document.getElementById('app');const IMG={hanys:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hanys-game.jpeg',hopla:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-hopla-game.jpeg',fachura:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-fachura-game.jpeg',podciep:'https://cdn.shopify.com/s/files/1/1019/1903/1622/files/bebok-podciep-game.jpeg'};const safe=()=>`onerror="this.style.opacity=.25"`;let state={page:'start',coins:500,ore:120,dogs:0,xp:0};try{Object.assign(state,JSON.parse(localStorage.getItem('beboki-v1')||'{}'))}catch(e){}function save(){localStorage.setItem('beboki-v1',JSON.stringify(state))}function go(page){state.page=page;save();render()}function header(){return `<div class="top"><img src="${IMG.podciep}" ${safe()}><div class="stats"><div><b>${state.coins}</b>monety</div><div><b>${state.ore}</b>ruda</div><div><b>${state.dogs}/10</b>psy</div></div>⚙️</div>`}function nav(active){return `<nav class="bottom">${[['settlement','🏠','Osada'],['map','🗺️','Mapa'],['team','👥','Drużyna'],['missions','📜','Misje'],['inventory','🎒','Ekwipunek']].map(x=>`<button class="${active===x[0]?'active':''}" data-go="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function start(){return `<section class="screen"><div class="hero"><div class="logo">BEBOKI</div><div class="sub">STRAŻNICY KATOWIC</div><p class="muted">Zbuduj osadę. Zbierz drużynę. Ruszaj w teren.</p><button class="btn gold" data-go="login">ZAGRAJ</button><button class="btn ghost" data-go="login">ZALOGUJ SIĘ</button><button class="btn ghost" data-go="settlement">GRAJ JAKO GOŚĆ</button></div><div class="card"><b>🐕 Pierwsza misja</b><p class="muted">Pies wyczuwa coś w starej piwnicy. Beboki muszą sprawdzić, co się dzieje.</p></div></section>`}function login(){return `<section class="screen"><div class="hero"><div class="logo">BEBOKI</div><div class="sub">WEJDŹ DO GRY</div></div><div class="card"><label>E-MAIL</label><input type="email"><label>HASŁO</label><input type="password"><button class="btn gold" data-go="settlement">WEJDŹ DO OSADY</button></div><button class="btn ghost" data-go="start">WRÓĆ</button></section>`}function settlement(){let b=[['mine',IMG.hanys,'⛏️ Kopalnia Hanysa'],['workshop',IMG.fachura,'🔧 Warsztat Fachury'],['lighthouse',IMG.podciep,'🏮 Latarnia Podciepa'],['shelter',IMG.hopla,'🐾 Schronisko']];return `<section class="screen">${header()}<div class="title">OSADA BEBOKÓW</div><p class="muted">Tu rozwijasz bazę i przygotowujesz wyprawy.</p><div class="card"><b>🐕 Uratowane psy: ${state.dogs}/10</b><div class="bar"><i style="width:${state.dogs*10}%"></i></div><button class="btn gold" data-go="map">🗺️ WYRUSZ NA MAPĘ</button></div><div class="grid">${b.map(x=>`<div class="card building" data-go="${x[0]}"><img src="${x[1]}" ${safe()}><div class="label">${x[2]}</div></div>`).join('')}</div></section>${nav('settlement')}`}function building(type){let d={mine:['KOPALNIA HANYSA',IMG.hanys,'Hanys kopie i buduje przejścia.','⛏️ KOP'],workshop:['WARSZTAT FACHURY',IMG.fachura,'Fachura tworzy sprzęt dla osady.','🔧 BUDUJ'],lighthouse:['LATARNIA PODCIEPA',IMG.podciep,'Podciep odkrywa ukryte przejścia.','🏮 ODKRYJ'],shelter:['SCHRONISKO DLA PSÓW',IMG.hopla,'Tutaj trafiają uratowane psy.','🐕 OPIEKA']}[type];return `<section class="screen">${header()}<button class="btn ghost" data-go="settlement">← OSADA</button><div class="card scene"><img src="${d[1]}" ${safe()}><h2>${d[0]}</h2><p class="muted">${d[2]}</p><button class="btn gold" data-upgrade="1">${d[3]}</button></div></section>`}function map(){return `<section class="screen">${header()}<div class="title">MAPA KATOWIC</div><div class="map"><button class="pin p1" data-go="mission">🐾</button><button class="pin p2">⛏️</button><button class="pin p3">🏮</button></div><div class="card mission"><div style="font-size:30px">🐕</div><div style="flex:1"><b>Piwnice kamienicy</b><div class="muted">Pies wyczuwa coś pod ziemią.</div></div><button class="btn gold" data-go="mission">WEJDŹ</button></div></section>${nav('map')}`}function mission(){return `<section class="screen">${header()}<button class="btn ghost" data-go="map">← MAPA</button><div class="hero"><div class="title">PIWNICE KAMIENICY</div><p class="muted">Coś ukrywa się za zawałem. Wybierz drużynę.</p></div><div class="card"><b>CEL</b><p>🐕 Uratuj pieska</p><p>🦴 Znajdź 6 kości</p><p>🔮 Odkryj sekret</p><button class="btn gold" data-go="team">WYBIERZ DRUŻYNĘ</button></div></section>`}function team(){return `<section class="screen">${header()}<div class="title">DRUŻYNA</div>${[['hanys','Hanys','Budowniczy'],['hopla','Hopla','Zwiadowczyni'],['fachura','Fachura','Wynalazca'],['podciep','Podciep','Latarnik']].map(x=>`<div class="card mission"><img src="${IMG[x[0]]}" ${safe()} style="width:62px;height:82px;object-fit:cover;object-position:top;border-radius:10px"><div><b>${x[1]}</b><div class="muted">${x[2]}</div></div></div>`).join('')}<button class="btn gold" data-go="gameplay">START WYPRAWY</button></section>${nav('team')}`}function gameplay(){return `<section class="screen">${header()}<div class="combat"><div class="rocks"></div>${[['hanys','c1'],['hopla','c2'],['fachura','c3'],['podciep','c4']].map(x=>`<div class="char ${x[1]}"><img src="${IMG[x[0]]}" ${safe()}></div>`).join('')}<div class="dog">🐶</div><div class="tools"><button data-action="mine">⛏️</button><button data-action="scout">🪢</button><button data-action="build">🔧</button><button data-action="light">🏮</button></div></div><div class="card"><b id="message">Coś jest za tym zawałem…</b><p class="muted">Klikaj umiejętności Beboków. Po trzech udanych akcjach ratujesz pieska.</p></div></section>`}function reward(){state.dogs=Math.min(10,state.dogs+1);state.coins+=120;state.ore+=5;state.xp=0;save();return `<section class="screen"><div class="hero"><div style="font-size:70px">🐕</div><div class="title">MISJA WYKONANA!</div><p class="muted">Piesek jest bezpieczny.</p></div><div class="card"><b>NAGRODY</b><p>🐕 +1 pies</p><p>🪙 +120 monet</p><p>⛏️ +5 rudy</p></div><button class="btn gold" data-go="settlement">WRÓĆ DO OSADY</button></section>`}function inventory(){return `<section class="screen">${header()}<div class="title">EKWIPUNEK</div>${['⛏️ Narzędzia','🔧 Części','🏮 Latarnia','🦴 Kości','💎 Kryształy','🗝️ Klucze'].map(x=>`<div class="card">${x}</div>`).join('')}</section>${nav('inventory')}`}function missions(){return `<section class="screen">${header()}<div class="title">MISJE</div><div class="card mission"><div>🐾</div><div style="flex:1"><b>Piwnice kamienicy</b><div class="muted">Pies wyczuwa coś pod ziemią.</div></div><button class="btn gold" data-go="mission">WYRUSZ</button></div><div class="card">🔒 Zaginiony piesek — wkrótce</div><div class="card">🔒 Stara kopalnia — wkrótce</div></section>${nav('missions')}`}function render(){let p=state.page;ROOT.innerHTML=p==='start'?start():p==='login'?login():p==='settlement'?settlement():['mine','workshop','lighthouse','shelter'].includes(p)?building(p):p==='map'?map():p==='mission'?mission():p==='team'?team():p==='gameplay'?gameplay():p==='reward'?reward():p==='inventory'?inventory():p==='missions'?missions():start()}ROOT.addEventListener('click',e=>{let el=e.target.closest('[data-go]');if(el){go(el.dataset.go);return}if(e.target.closest('[data-upgrade]')){state.coins+=50;state.ore=Math.max(0,state.ore-20);save();render();return}let a=e.target.closest('[data-action]');if(a){state.xp+=10;state.ore+=a.dataset.action==='mine'?5:0;let msg={mine:'Hanys przebija zawał!',scout:'Hopla znalazła bezpieczne przejście!',build:'Fachura uruchamia mechanizm!',light:'Podciep odkrywa ukryte światło!'}[a.dataset.action];let m=document.getElementById('message');if(m)m.textContent=msg;if(state.xp>=30){go('reward')}else save()}});render();</script></body></html>
