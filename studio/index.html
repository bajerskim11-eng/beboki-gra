<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beboki Story Studio</title><style>body{margin:0;background:#111;color:#f4ead6;font-family:Inter,system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid #3b342d;background:#171411}h1{margin:0;font-size:30px}.sub{opacity:.7}main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#1b1714;border:1px solid #3b342d;border-radius:16px;padding:20px}.full{grid-column:1/-1}textarea,input,select{width:100%;box-sizing:border-box;background:#0f0d0c;color:#f4ead6;border:1px solid #4a4138;border-radius:10px;padding:12px;margin:7px 0 12px}button{background:#d9a441;color:#16110a;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;margin-right:8px}pre{white-space:pre-wrap;line-height:1.5;background:#0d0b0a;padding:14px;border-radius:10px;max-height:480px;overflow:auto}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#31281f;margin:3px;font-size:12px}@media(max-width:800px){main{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><h1>🐾 BEBOKI STORY STUDIO</h1><div class="sub">Historia → pamięć → grafika → wideo → bajka na YouTube</div></header><main><section class="card"><h2>1. Scenarzysta</h2><label>Pomysł sceny</label><textarea id="idea">Pies wyczuwa pierwszy fragment Serca Śląska pod starą kamienicą w Katowicach.</textarea><label>Miejsce</label><input id="scene" value="stara kamienica, noc, mokry bruk, wejście do piwnicy"><label>Bebok</label><select id="character"><option>Hopla</option><option>Podciep</option><option>Hanys</option><option>Fachura</option></select><button onclick="story()">Napisz scenę</button></section><section class="card"><h2>2. Pamięć</h2><input id="mq" placeholder="szukaj: pies, serce, Katowice..."><button onclick="memorySearch()">Szukaj</button><button onclick="loadMemory()">Pokaż wszystko</button><div id="memory"></div></section><section class="card"><h2>3. Generator grafiki</h2><textarea id="imgIdea">Cztery Beboki obserwują psa, który węszy przy wejściu do starej piwnicy.</textarea><button onclick="gen('image')">Wyślij do ComfyUI</button></section><section class="card"><h2>4. Generator wideo</h2><textarea id="vidIdea">Pies zaczyna węszyć, Beboki patrzą na niego, kamera powoli zjeżdża w stronę świecącego śladu łapy.</textarea><button onclick="gen('video')">Wyślij do ComfyUI</button></section><section class="card full"><h2>Wynik</h2><pre id="out">Gotowe. Najpierw napiszmy pierwszy odcinek.</pre></section></main><script>async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.detail||'Błąd');return d}async function story(){try{const d=await api('/api/story',{method:'POST',body:JSON.stringify({idea:idea.value,scene:scene.value,character:character.value})});out.textContent=d.result;loadMemory()}catch(e){out.textContent=e}}async function gen(kind){try{const id=kind==='image'?'imgIdea':'vidIdea';const d=await api('/api/generate/'+kind,{method:'POST',body:JSON.stringify({idea:document.getElementById(id).value,scene:scene.value,character:character.value})});out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent=e}}async function loadMemory(){const d=await api('/api/memory');memory.innerHTML=d.items.map(x=>`<div><span class="badge">${x.kind}</span><b>${x.title}</b><p>${x.content.slice(0,280)}...</p></div>`).join('')}async function memorySearch(){const d=await api('/api/memory/search?q='+encodeURIComponent(mq.value));memory.innerHTML=d.items.map(x=>`<div><span class="badge">${x.kind}</span><b>${x.title}</b><p>${x.content.slice(0,280)}...</p></div>`).join('')}loadMemory()</script></body></html>
